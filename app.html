<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Operaciones Dislicores</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --gold:#c2aa5b; --gold-light:#d4bf7a; --gold-dark:#a89245; --gold-translucent:#c2aa5b1f;
  --black:#0a0a0a; --black-card:#1a1a1a; --white:#fff;
  --gray-50:#f7f6f4; --gray-100:#f0ede8; --gray-200:#e2ddd6; --gray-300:#c8c2b8; --gray-400:#9e9890; --gray-500:#726d66; --gray-600:#4a4640;
  --bg:var(--gray-50); --card:#fff; --border:var(--gray-200); --text:#1a1a1a; --muted:var(--gray-500);
  --ok:#2e8b57; --ok-bg:#e4f3ea; --warn:#b8860b; --warn-bg:#fbf1d9; --bad:#c4453a; --bad-bg:#fae7e4; --info-bg:#eef0f3;
  --shadow:0 2px 8px #0000000f; --radius:16px;
  --font:"DM Sans",system-ui,-apple-system,sans-serif; --mono:"JetBrains Mono","Fira Code",monospace;
}
html.dark{
  --bg:#0f0e0c; --card:#1a1916; --border:#2e2b26; --text:#f0ece4; --muted:#8a8378;
  --gray-100:#1a1916; --gray-200:#2e2b26; --gray-300:#3d3930; --gray-400:#6b6560; --gray-500:#8a8378; --gray-600:#b0a898;
  --ok-bg:#16281d; --warn-bg:#2f2814; --bad-bg:#2f1b17; --info-bg:#221f1b; --shadow:0 2px 8px #0006;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.35}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
#top{position:sticky;top:0;z-index:20;background:var(--black);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
#top .logo{font-size:11px;letter-spacing:.22em;font-weight:600;color:var(--gold)}
#top .tt{flex:1;min-width:0}
#top .tt b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .tt span{font-size:11.5px;color:#bdb6a6}
.ib{background:#ffffff14;border:0;color:#fff;border-radius:12px;padding:8px 11px;font-weight:600;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:21px;margin:6px 0 4px} h2{font-size:16px;margin:18px 0 8px} p{margin:6px 0}
.muted{color:var(--muted)} .small{font-size:12.5px} .mono{font-family:var(--mono)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin:10px 0;box-shadow:var(--shadow)}
.card.gold{border-left:4px solid var(--gold)}
.tile{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:var(--radius);padding:14px;margin:10px 0;cursor:pointer;box-shadow:var(--shadow)}
.tile .ic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--black);color:var(--gold);display:grid;place-items:center;font-size:21px}
.tile b{display:block;font-size:16px} .tile span{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--black);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}
html.dark .btn{background:var(--gold);color:#17130e}
.btn.gold{background:var(--gold);color:#17130e} .btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--border)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px} .btn.block{display:flex;width:100%} .btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.red{background:var(--bad);color:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .grow{flex:1;min-width:0} .row>b.grow{flex:1 1 110px;min-width:110px} .sp{height:8px}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:12px;background:var(--card);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
label.lb{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 5px;text-transform:uppercase;letter-spacing:.04em}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--gray-100);color:var(--gray-600);border:1px solid transparent}
.chip.sel{background:var(--gold-translucent);color:var(--gold-dark);border-color:var(--gold)} .chip.btn2{cursor:pointer}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.info{background:var(--info-bg);color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--gray-200);overflow:hidden} .bar i{display:block;height:100%;background:var(--gold)}
.bar.u i{background:var(--ok)} .bar.w i{background:var(--warn)} .bar.b i{background:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px} .kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 12px}
.kpi b{display:block;font-size:22px;font-family:var(--mono)} .kpi span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.line{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--gray-300);border-radius:14px;padding:10px 12px;margin:7px 0;cursor:pointer}
.line.ok{border-left-color:var(--ok);opacity:.78} .line.parc{border-left-color:var(--warn)} .line.no{border-left-color:var(--bad)}
.line .r{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--gold-dark)} .line .d{font-size:14px;font-weight:600;margin:1px 0 4px}
.line .q{margin-left:auto;text-align:right;white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:15px}
.sheet-bg{position:fixed;inset:0;background:#0a0a0acc;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 4px;font-size:18px}
.big{font-family:var(--mono);font-weight:700;font-size:30px;line-height:1.1}
.video{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3;margin:8px 0} .video video{width:100%;height:100%;object-fit:cover}
.video .fr{position:absolute;inset:18% 10%;border:2px solid var(--gold);border-radius:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:12px;z-index:90;font-weight:600;max-width:90vw;box-shadow:0 8px 24px #0006}
table{width:100%;border-collapse:collapse;font-size:13px} th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:6px 6px;border-bottom:1px solid var(--border)} td{padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:middle}
td input{padding:7px 8px;border-radius:9px;width:84px}
.hint{background:var(--info-bg);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted)} .hint.warn{background:var(--warn-bg);color:var(--warn)}
.tabs{display:flex;gap:6px;overflow:auto;padding-bottom:4px;margin:10px 0;align-items:flex-start;-webkit-overflow-scrolling:touch}
.tabs .chip{flex:none;white-space:nowrap;align-self:flex-start;padding:7px 12px}
#top .tt span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hide{display:none!important}
@media(min-width:760px){ .sheet{border-radius:22px;margin-bottom:6vh} .sheet-bg{align-items:center} }

/* ===== v0.3: estados de tarea, ingreso, tablero ===== */
.chip.st-pend{background:var(--gray-100);color:var(--gray-600)}
.chip.st-curso{background:var(--gold-translucent);color:var(--gold-dark);border-color:var(--gold)}
.chip.st-ok{background:var(--ok-bg);color:var(--ok)}
.chip.st-nov{background:var(--warn-bg);color:var(--warn)}
html.dark .chip.st-curso{color:var(--gold-light)}
.task{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--gray-300);border-radius:var(--radius);padding:12px 14px;margin:9px 0;cursor:pointer;box-shadow:var(--shadow);color:inherit}
.task.curso{border-left-color:var(--gold)} .task.ok{border-left-color:var(--ok)} .task.nov{border-left-color:var(--warn)}
.task .tt{display:flex;gap:8px;align-items:flex-start} .task .tt b{flex:1;min-width:0;font-size:15.5px}
.task .sub{font-size:12.5px;color:var(--muted);margin:3px 0 7px}
.task .mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.bar.big{height:10px}
.who{display:flex;gap:10px;align-items:center}
.avatar{flex:none;width:38px;height:38px;border-radius:50%;background:var(--black);color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:13px}
html.dark .avatar{background:var(--gold);color:#17130e}
.login{max-width:520px;margin:0 auto}
.login-head{background:var(--black);color:#fff;border-radius:22px;padding:26px 20px;text-align:center;margin:4px 0 16px}
.login-head small{letter-spacing:.24em;color:var(--gold);font-weight:700;font-size:11px}
.login-head h1{margin:8px 0 4px;font-size:23px;color:#fff} .login-head p{margin:0;color:#cfc8b8;font-size:13.5px}
.role-choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin:10px 0}
.role-btn{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:14px;padding:13px 12px;text-align:left;cursor:pointer;box-shadow:var(--shadow);color:inherit}
.role-btn b{display:block;font-size:15px} .role-btn span{font-size:12px;color:var(--muted)}
.user-row{display:flex;gap:11px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 12px;margin:7px 0;cursor:pointer}
.user-row .nm{font-weight:600} .user-row .rl{font-size:12px;color:var(--muted)}
.grp-titulo{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 4px}
.sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.05em}.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--border)}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin:8px 0}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.empty{text-align:center;color:var(--muted);padding:22px 10px}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:700}
.sync{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:#bdb6a6}.sync i{width:8px;height:8px;border-radius:50%;background:#8a8378;display:inline-block}.sync.on i{background:#4ec380}.sync.off i{background:#e5978c}
select.compact{width:auto;padding:8px 10px}
.sheet h3{margin:2px 0 6px}
table.mini td,table.mini th{padding:6px 5px}

/* ---- listado de separacion ---- */
.lst-sheet{background:#fff;color:#111;border:1px solid #0002;border-radius:10px;padding:10px;margin-top:10px;overflow-x:auto}
.lst-title{background:#282828;color:#fff;text-align:center;font-weight:700;font-size:16px;padding:8px;border-radius:6px}
.lst-res{border-collapse:collapse;width:100%;margin:8px 0;font-size:13px}
.lst-res th,.lst-res td{border:1px solid #888;padding:4px 8px;text-align:left}
.lst-res th{background:#ddd;width:20%}
table.lst{border-collapse:collapse;width:100%;font-size:12px}
table.lst th{background:#505050;color:#fff;border:1px solid #444;padding:5px 6px;text-align:center}
table.lst td{border:1px solid #999;padding:4px 6px;vertical-align:top}
table.lst tbody tr:nth-child(even){background:#f0f0f0}
table.lst .n{text-align:right;white-space:nowrap}
table.lst .ck{text-align:center;width:28px}
@media print{
  @page{size:letter landscape;margin:7mm 8mm 10mm 8mm}
  html,body{background:#fff!important}
  #top,.noprint,.toast,nav{display:none!important}
  main#app{max-width:none!important;width:100%!important;margin:0!important;padding:0!important}
  .lst-sheet{border:0;padding:0;margin:0;overflow:visible;border-radius:0}
  .lst-title{font-size:16px;padding:5px;border-radius:3px}
  .lst-res{margin:5px 0;font-size:13px}
  .lst-res th,.lst-res td{padding:3px 7px}
  .lst-res th{width:11%;white-space:nowrap}
  table.lst{font-size:15px;width:100%}
  table.lst th{padding:5px 7px;font-size:13px}
  table.lst td{padding:5px 7px;line-height:1.2}
  table.lst td.n{font-size:17px}
  table.lst{table-layout:fixed;width:100%}
  table.lst .c-ub{width:9%} table.lst .c-ref{width:11%} table.lst .c-bod{width:8%} table.lst .c-bar{width:14.5%} table.lst .c-ue{width:5%} table.lst .c-q{width:11%}
  table.lst td,table.lst th{overflow-wrap:anywhere}
  table.lst th{letter-spacing:0;white-space:nowrap}
  table.lst td.mono{font-size:13.5px;letter-spacing:0}
  html,body{width:100%!important;overflow:visible!important}
  table.lst tbody tr:nth-child(even) td{background:#dcdcdc!important}
  table.lst tbody tr:nth-child(odd) td{background:#fff!important}
  table.lst thead{display:table-header-group}
  table.lst tr{page-break-inside:avoid}
  .lst-title,table.lst th,table.lst td,.lst-res th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.qc{display:flex;align-items:center;justify-content:space-between;gap:10px}
.qc .bx{font-size:1.1em;line-height:1}

/* ---- interruptor (Oferta virtual, escaneo obligatorio) ---- */
.swwrap{margin-bottom:10px}
.swwrap .task{margin-bottom:2px}
label.sw{display:flex;align-items:center;gap:10px;padding:6px 4px;cursor:pointer;font-size:13px;font-weight:600;position:relative}
label.sw small{font-weight:400;opacity:.7}
label.sw input{position:absolute;opacity:0;width:0;height:0}
label.sw i{flex:none;width:42px;height:24px;border-radius:12px;background:#bbb;position:relative;transition:background .15s}
label.sw i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
label.sw input:checked+i{background:var(--gold,#c2aa5b)}
label.sw input:checked+i::after{transform:translateX(18px)}

/* ---- matriz: panel de acciones a la izquierda y lista a la derecha ---- */
main.wide{max-width:1240px}
.mz-wrap{display:grid;grid-template-columns:330px 1fr;gap:18px;align-items:start}
.mz-side{position:sticky;top:72px;max-height:calc(100vh - 90px);overflow:auto;padding-right:6px}
.kp2{grid-template-columns:repeat(3,1fr)}
.vseg{flex-wrap:wrap}
@media(max-width:900px){.mz-wrap{grid-template-columns:1fr}.mz-side{position:static;max-height:none}}

/* Inicio compacto (coordinador y administrador): fichas en dos columnas */
.hc .tg{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:6px;margin:6px 0}
.hc .tile{margin:0;padding:8px 10px;gap:9px;border-radius:12px;box-shadow:none}
.hc .tile .ic{width:32px;height:32px;border-radius:9px;font-size:16px}
.hc .tile b{font-size:14px;line-height:1.2}
.hc .tile span{font-size:11.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hc h2{font-size:15px;margin:12px 0 2px}
.hc .card{padding:10px 12px;margin:6px 0}
.hc .lb{margin:6px 0 3px}
.hc .seg .chip{padding:5px 10px}

/* Vista compacta para coordinador, supervisor y administrador (en pantalla; la impresion no cambia) */
@media screen{
body.compacto main{max-width:960px;padding:8px 14px 60px}
body.compacto main.wide{max-width:1240px}
body.compacto #top{padding:6px 12px}
body.compacto h1{font-size:18px;margin:2px 0 2px}
body.compacto h2{font-size:14px;margin:10px 0 4px}
body.compacto p{margin:3px 0}
body.compacto .card{padding:8px 11px;margin:6px 0;border-radius:12px;box-shadow:none}
body.compacto .tile{padding:7px 10px;margin:5px 0;gap:9px;border-radius:12px;box-shadow:none}
body.compacto .tile .ic{width:32px;height:32px;font-size:16px;border-radius:9px}
body.compacto .tile b{font-size:14px;line-height:1.2}
body.compacto .tile span{font-size:12px;line-height:1.25}
body.compacto .task{padding:7px 11px;margin:5px 0;border-radius:12px;box-shadow:none}
body.compacto .task .tt b{font-size:14px}
body.compacto .task .sub{margin:1px 0 4px}
body.compacto .task .mini{margin-top:4px}
body.compacto .btn{padding:8px 12px;border-radius:10px}
body.compacto .btn.sm{padding:5px 9px;font-size:12.5px}
body.compacto .sp{height:4px}
body.compacto input[type=text],body.compacto input[type=number],body.compacto input[type=search],body.compacto select,body.compacto textarea{padding:7px 10px;border-radius:10px}
body.compacto label.lb{margin:6px 0 3px}
body.compacto .chip{padding:3px 8px}
body.compacto .tabs{margin:5px 0;padding-bottom:2px}
body.compacto .tabs .chip{padding:5px 10px}
body.compacto .kpis{gap:6px}
body.compacto .kpi{padding:6px 10px;border-radius:10px}
body.compacto .kpi b{font-size:18px}
body.compacto .line{padding:6px 10px;margin:4px 0;border-radius:10px}
body.compacto .hint{padding:7px 10px;font-size:12.5px}
body.compacto td{padding:5px 6px}
body.compacto .bar{height:6px}
body.compacto .sheet{padding:12px 14px calc(14px + env(safe-area-inset-bottom))}
}

/* ---- Despacho: tablero de vehiculos ---- */
.kfil{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:6px;margin:6px 0}
.kf{background:var(--card,#fff);border:1px solid #0002;border-radius:10px;padding:6px 4px;text-align:center;cursor:pointer;font:inherit;color:inherit}
.kf b{display:block;font-size:20px;line-height:1.1}.kf span{font-size:11px;color:#777}
.kf.sel{border-color:var(--gold-dark,#a8892f);box-shadow:0 0 0 2px var(--gold,#c4aa59) inset}.kf.hot b{color:#c0392b}
.vh{background:var(--card,#fff);border:1px solid #0002;border-left:5px solid #bbb;border-radius:12px;padding:9px 11px;margin:8px 0}
.vh.pub{border-left-color:var(--gold,#c4aa59)}.vh.libre{border-left-color:#e0a030}.vh.curso{border-left-color:#3b82c4}.vh.fin{border-left-color:#2e9d5b}
.vh .vt{display:flex;align-items:center;gap:8px;cursor:pointer}.vh .vt .pl{font-size:17px}
.vh .ck{background:none;border:0;font-size:22px;cursor:pointer;padding:0 2px;color:inherit}
.vh .vs{font-size:12.5px;color:#666;margin:3px 0 5px;cursor:pointer}
.vh .vc{display:flex;align-items:center;gap:8px;margin:4px 0}.vh .vc .bar{flex:1;margin:0}
.vh .va{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:5px 0}
.vh .vb{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.selbar{position:sticky;bottom:8px;z-index:6;display:flex;gap:8px;align-items:center;background:#282828;color:#fff;border-radius:12px;padding:8px 10px;margin-top:10px;box-shadow:0 4px 14px #0005}
.selbar select{background:#fff;color:#111;min-width:0}
@media print{.kfil,.selbar,.vh .vb{display:none}}

/* ---- aviso de funciones en construccion ---- */
.obra{display:flex;gap:10px;align-items:center;background:#fff4d6;border:1px solid #e0a030;border-left:5px solid #e0a030;color:#5b4300;border-radius:10px;padding:8px 12px;margin:6px 0 10px;font-size:13px}
.obra b{background:#e0a030;color:#111;border-radius:6px;padding:2px 8px;font-size:11.5px;letter-spacing:.04em;white-space:nowrap}
.bobra{font-style:normal;background:#e0a030;color:#111;border-radius:6px;padding:1px 6px;font-size:10px;letter-spacing:.04em;margin-left:6px;white-space:nowrap;vertical-align:middle}

</style>
</head>

<div id="top"></div>
<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
<script>
(function(){
'use strict';
/* ===== 10_core.js ===== */
/* =====================================================================

/* ---- nube: tabla "documentos" (coleccion, id, datos jsonb, actualizado), igual que Semaforos ---- */
function api(method,path,body,extra){
  var h={"apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json"};
  if(extra) Object.keys(extra).forEach(function(k){ h[k]=extra[k]; });
  return fetch(SUPA_URL+"/rest/v1/"+path,{method:method,headers:h,body:(body===undefined||body===null)?undefined:JSON.stringify(body)}).then(function(r){
    if(!r.ok) return r.text().then(function(t){ S.conectado=(r.status<500); throw new Error("Error de la nube ("+r.status+")"+(t&&t.length<160?": "+t:"")); });
    S.conectado=true;
    return r.text().then(function(t){ return t?JSON.parse(t):null; });
  },function(e){ S.conectado=false; throw new Error("Sin conexión a la nube"); });
}
var enc=encodeURIComponent;
var DB={
  /* o: {filter:{"datos->>campo":"eq.valor"}, select, order, all:true, limit} */
  list:async function(col,o){
    o=o||{}; var N=1000, out=[], off=0;
    var base="documentos?coleccion=eq."+enc(col)+"&select="+enc(o.select||"id,datos,actualizado")+"&order="+enc(o.order||"id.asc");
    if(o.filter) Object.keys(o.filter).forEach(function(k){ base+="&"+enc(k)+"="+enc(o.filter[k]); });
    for(;;){
      var rows=await api("GET",base+"&limit="+(o.limit||N)+"&offset="+off);
      rows=rows||[]; out=out.concat(rows);
      if(!o.all||rows.length<(o.limit||N)) break; off+=(o.limit||N);
    }
    return out;
  },
  get:async function(col,id){ var r=await api("GET","documentos?coleccion=eq."+enc(col)+"&id=eq."+enc(id)+"&select=id,datos,actualizado&limit=1"); return r&&r[0]?r[0]:null; },
  set:function(col,id,datos){ return api("POST","documentos?on_conflict=coleccion,id",{coleccion:col,id:id,datos:datos,actualizado:ahora()},{Prefer:"resolution=merge-duplicates,return=minimal"}); },
  setMany:async function(col,docs,onProg){
    for(var i=0;i<docs.length;i+=400){
      var chunk=docs.slice(i,i+400).map(function(d){ return {coleccion:col,id:d.id,datos:d.datos,actualizado:ahora()}; });
      await api("POST","documentos?on_conflict=coleccion,id",chunk,{Prefer:"resolution=merge-duplicates,return=minimal"});
      if(onProg) onProg(Math.min(i+400,docs.length),docs.length);
    }
  },
  patch:function(col,id,cambios){ return api("POST","rpc/actualizar_documento",{p_coleccion:col,p_id:id,p_cambios:cambios}); },
  del:function(col,id){ return api("DELETE","documentos?coleccion=eq."+enc(col)+"&id=eq."+enc(id)); },
  delFilter:function(col,filter){ var q="documentos?coleccion=eq."+enc(col); Object.keys(filter).forEach(function(k){ q+="&"+enc(k)+"="+enc(filter[k]); }); return api("DELETE",q); },
  rpc:function(nombre,args){ return api("POST","rpc/"+nombre,args); }
};

/* ---------- lectura de Excel ---------- */
function leerExcel(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){ try{ res(XLSX.read(new Uint8Array(fr.result),{type:"array"})); }catch(e){ rej(e); } };
    fr.onerror=function(){ rej(new Error("No se pudo leer el archivo")); };
    fr.readAsArrayBuffer(file);
  });
}
/* Varios Excel a la vez: cb recibe [{wb,f}, ...] */

    Promise.all(fs.map(function(f){ return leerExcel(f).then(function(wb){ return {wb:wb,f:f}; },function(){ toast("No se pudo leer "+f.name); return null; }); })).then(function(l){ l=l.filter(Boolean); if(l.length) cb(l); });
  },true);
}

function tablaDe(wb,claves,pref){
  var names=wb.SheetNames.slice();
  if(pref&&names.indexOf(pref)>0){ names.splice(names.indexOf(pref),1); names.unshift(pref); }
  for(var s=0;s<names.length;s++){
    var aoa=XLSX.utils.sheet_to_json(wb.Sheets[names[s]],{header:1,raw:true,defval:""});
    for(var i=0;i<Math.min(aoa.length,25);i++){
      for(var j=0;j<aoa[i].length;j++){ if(claves.indexOf(normH(aoa[i][j]))>=0) return {hoja:names[s],hdr:aoa[i],rows:aoa.slice(i+1)}; }
    }
  }
  return null;
}

/* Tipo de documento segun las columnas (y, si hace falta, el prefijo del numero) */
function tipoDe(hdr,docs){
  var h=hdr.map(normH); function tiene(x){ return h.indexOf(x)>=0; }
  if(tiene("salidas (inv.)")) return "REM";
  if(tiene("cant. comprometida")&&(tiene("bodega entrada")||tiene("bodega salida"))) return "REQ";
  if(/^PED/.test(String(docs[0]||"").toUpperCase())||tiene("cant. pedida")||tiene("estado docto.")) return "PED";
  if(tiene("cliente resumen factura")||tiene("numero planilla de factura")) return "FAC";
  if(tiene("cant. comprom.")) return "PED";
  var p=String(docs[0]||"").toUpperCase();
  if(/^FV/.test(p)) return "FAC"; if(/-RQ[TV]-|^RQ[TV]/.test(p)) return "REQ"; if(/^(T(CA|BV)|SM)/.test(p)) return "REM";
  return "DOC";
}

  var out=[],docs={},primero="",excl=0;
  t.rows.forEach(function(r){
    var ref=normRef(r[m.ref]); if(!ref) return;
    /* remisiones: solo se alistan SM, TBV y TCA (documentos con salidas); entradas y otros tipos se omiten */
    if(m.tdoc>=0){ var td=String(r[m.tdoc]||"").trim().toUpperCase(); if(td&&!/^(SM|TBV|TCA)$/.test(td)){ excl++; return; } }
    var c=parseDbl(r[m.cant]); if(!(c>0)) return;
    var doc=m.doc>=0?String(r[m.doc]||"").trim():""; if(doc){ docs[doc]=1; if(!primero) primero=doc; }
    var dm=function(a,b,c){ return (m[a]>=0&&m[b]>=0&&m[c]>=0)?(parseDbl(r[m[a]])*parseDbl(r[m[b]])*parseDbl(r[m[c]])):0; };
    out.push({cli:m.cli>=0?nombreCliente(r[m.cli]):"",p:m.pes>=0?parseDbl(r[m.pes]):0,vi:dm("ali","ani","pri"),ve:dm("ale","ane","pre"),ref:ref,desc:m.desc>=0?descLimpia(r[m.desc],ref):"",bar:m.bar>=0?normBar(r[m.bar]):"",ue:m.ue>=0?ueDe(r[m.ue]):0,cant:c,bod:m.bod>=0?String(r[m.bod]||"").trim():"",ciu:m.ciu>=0?String(r[m.ciu]||"").trim():"",grupo:m.grupo>=0?String(r[m.grupo]||"").trim():"",linea:m.linea>=0?String(r[m.linea]||"").trim():"",doc:doc});
  });
  var tipo=tipoDe(t.hdr,[primero]); out.forEach(function(l){ l.t=tipo; });

}
function parseMaestro(t){
  var m=colMap(t.hdr,A_MAE); if(m.ref<0) throw new Error("El maestro debe traer la columna Referencia.");
  var mae={},n=0;
  /* Formato por unidad de medida (una fila por presentacion: C12 CAJA(12), UND UNIDAD): el factor de empaque es el de la caja */
  var hh=t.hdr.map(normH), iUM=hh.indexOf("u.m."), iDU=hh.indexOf("desc. u.m."), fum={};
  if(m.ue<0&&(iUM>=0||iDU>=0)){
    t.rows.forEach(function(r){ var ref=normRef(r[m.ref]); if(!ref) return; var txt=String((iDU>=0?r[iDU]:"")||"")+" "+String((iUM>=0?r[iUM]:"")||""), g=/\((\d+)\)/.exec(txt)||/\bC[J]?(\d+)\b/i.exec(txt), f=g?parseInt(g[1],10):1; if(!(f>0)) f=1; fum[ref]=Math.max(fum[ref]||1,f); });
  }
  var fue={}; if(m.ue>=0) t.rows.forEach(function(r){ var ref=normRef(r[m.ref]); if(ref) fue[ref]=Math.max(fue[ref]||1,ueDe(r[m.ue])||1); });
  t.rows.forEach(function(r){
    var ref=normRef(r[m.ref]); if(!ref) return;
    if(mae[ref]){ var o=mae[ref], bb=m.bar>=0?normBar(r[m.bar]):"", pp=m.peso>=0?parseDbl(r[m.peso]):0; if(!o.b&&bb) o.b=bb; if(!(o.p>0)&&pp>0) o.p=pp; if(m.grupo>=0&&!o.g) o.g=String(r[m.grupo]||"").trim(); if(m.linea>=0&&!o.l) o.l=String(r[m.linea]||"").trim(); return; }
    var ve=(m.ae>=0&&m.he>=0&&m.pe>=0)?parseDbl(r[m.ae])*parseDbl(r[m.he])*parseDbl(r[m.pe]):0;
    mae[ref]={d:m.desc>=0?String(r[m.desc]||"").trim():"",b:m.bar>=0?normBar(r[m.bar]):"",u:m.ue>=0?(fue[ref]||1):(fum[ref]||1),g:m.grupo>=0?String(r[m.grupo]||"").trim():"",l:m.linea>=0?String(r[m.linea]||"").trim():"",p:m.peso>=0?parseDbl(r[m.peso]):0,vi:m.vi>=0?parseDbl(r[m.vi]):0,ve:ve}; n++;
  });
  return {mae:mae,n:n};
}
/* Composicion de ofertas virtuales: una fila por componente */
function parseComposicion(t){
  var m=colMap(t.hdr,A_OF); if(m.of<0||m.comp<0||m.cant<0) throw new Error("La composición debe traer oferta, componente y cantidad.");

    var o=normRef(r[m.of]).toUpperCase(), c=normRef(r[m.comp]); if(!o||!c) return;
    var x=of[o]=of[o]||{desc:"",comps:[]};
    if(!x.desc&&m.odesc>=0) x.desc=String(r[m.odesc]||"").trim();
    x.comps.push({ref:c,desc:m.cdesc>=0?String(r[m.cdesc]||"").trim():"",cant:parseDbl(r[m.cant])}); n++;
  });

/* Matriz de asignacion: Referencia, Descripcion, Zona, Secuencia, Desglosar_Oferta (y opcionales Ubicacion, Auxiliar) */
function parseMatriz(t){
  var m=colMap(t.hdr,A_MTZ); if(m.ref<0||(m.zona<0&&m.aux<0)) throw new Error("La matriz debe traer las columnas Referencia y Auxiliar.");
  var rows=[],zonas={},seen={};
  t.rows.forEach(function(r){
    var ref=normRef(r[m.ref]); if(!ref||seen[ref]) return; seen[ref]=1;
    var zona=m.zona>=0?String(r[m.zona]||"").trim():"";
    var flag=m.flag>=0?normH(r[m.flag]):"";
    rows.push({ref:ref,desc:m.desc>=0?String(r[m.desc]||"").trim():"",zona:zona,seq:m.seq>=0?parseDbl(r[m.seq]):0,flag:flag==="si"?"SI":flag==="no"?"NO":"",ubic:m.ubic>=0?String(r[m.ubic]==null?"":r[m.ubic]).trim():"",aux:m.aux>=0?String(r[m.aux]||"").trim():""});
    zonas[zona]=(zonas[zona]||0)+1;
  });
  return {rows:rows,zonas:zonas,cols:m};

/* ---------- logica de negocio ---------- */
/* Desglose de ofertas virtuales (OF). Regla: la base de ofertas manda.
   - Si la oferta tiene marca de desglose para el C.O. (SI/NO), se respeta.
   - Sin marca: se desglosan las de facturas y pedidos; las de requisiciones y remisiones se dejan como producto armado. */
/* Decision de desglose de una oferta en un C.O.: 1) excepcion de la ciudad, 2) categoria global (virtual SI/NO), 3) sin definir (null → regla por tipo de documento). */
function desgloseDe(code,co){
  var f=(S.desg[co]||{})[code]; if(f===true||f===false) return {v:f,fuente:"ciudad"};
  var c=S.cat[code]; if(c&&c.virtual===true) return {v:true,fuente:"categoría"}; if(c&&c.virtual===false) return {v:false,fuente:"categoría"};
  return {v:null,fuente:"sin categorizar"};
}
/* Toda oferta que aparezca en un listado o en una composicion queda registrada en la base de ofertas (sin categorizar) para validarla */
async function registrarOfertas(items,origen,co){
  var nuevos=[], vistos={};
  items.forEach(function(x){ var code=String(x.ref||x.code||"").toUpperCase(); if(!code||vistos[code]||S.cat[code]||!(x.forzar||esOferta(code,x.desc))) return; vistos[code]=1; nuevos.push({id:code,datos:{codigo:code,desc:x.desc||"",virtual:null,origen:origen,detectadoCo:co||"",detectadoEn:ahora(),detectadoPor:S.me?S.me.id:""}}); });
  if(!nuevos.length) return 0;
  await DB.setMany("ofertas_cat",nuevos); nuevos.forEach(function(n){ S.cat[n.id]=n.datos; }); return nuevos.length;
}
function desglosar(lineas,co){
  var ueArch={}; lineas.forEach(function(l){ if(!esOferta(l.ref,l.desc)&&l.ue>0&&!ueArch[l.ref]) ueArch[l.ref]=l.ue; });
  var out=[], sin={}, nOF=0, nComp=0, dejadas=0;
  lineas.forEach(function(l){
    if(!esOferta(l.ref,l.desc)){ out.push(l); return; }
    var code=l.ref.toUpperCase(), flag=desgloseDe(code,co).v; if(flag===null) flag=undefined;
    var quiere=(flag===true)||(flag===undefined&&(l.t==="FAC"||l.t==="PED"||!l.t));
    var comp=S.ofr[code];
    if(quiere&&comp&&comp.comps&&comp.comps.length){
      nOF++;
      comp.comps.forEach(function(c){
        var m=S.mae[c.ref]||{};
        out.push({ref:c.ref,desc:c.desc||m.d||"",bar:m.b||"",ue:ueArch[c.ref]||m.u||1,cant:rb(l.cant*c.cant),bod:l.bod,grupo:"",linea:"",doc:l.doc,t:l.t}); nComp++;
      });
    } else { if(quiere) sin[l.ref]=l.desc; else dejadas++; out.push(l); }
  });
  return {lineas:out,nOF:nOF,nComp:nComp,sin:sin,dejadas:dejadas};
}
/* Consolida por referencia: suma cantidades; completa grupo/linea/empaque/barras desde el maestro. Sin filtros. */
function consolidar(lineas){
  var mp={};
  lineas.forEach(function(l){
    var m=S.mae[l.ref]||{}, k=l.ref, it=mp[k];
    if(!it){ it=mp[k]={bod:l.bod||"",ref:l.ref,desc:l.desc||m.d||"",bar:l.bar||m.b||"",ue:(l.ue>0?l.ue:(m.u||1)),total:0,grupo:l.grupo||m.g||"SIN GRUPO",linea:l.linea||m.l||"SIN LÍNEA"}; }
    it.total+=l.cant; it._t=it._t||{}; if(l.t) it._t[l.t]=1;
    if(!(it.p>0)&&l.p>0){ it.p=l.p; it.vi=l.vi||0; it.ve=l.ve||0; }
    if(!it.desc) it.desc=l.desc||m.d||""; if(!it.bar) it.bar=l.bar||m.b||"";
  });
  return Object.keys(mp).sort(ordenRef).map(function(k){ var it=mp[k]; it.tipos=Object.keys(it._t||{}).sort().join("/"); delete it._t; return it; });
}
function resumenTipos(raw){ var o={}; raw.forEach(function(l){ var k=l.t||"DOC", x=o[k]=o[k]||{n:0,u:0}; x.n++; x.u+=l.cant; }); return o; }
function totalesPorRef(raw,t){ var m={}; raw.forEach(function(l){ if(l.t===t) m[l.ref]=(m[l.ref]||0)+l.cant; }); return m; }
/* La remision es el resultado de la requisicion: si traen las mismas cantidades por referencia son lo mismo. */
function mismosProductos(raw){
  var a=totalesPorRef(raw,"REQ"), b=totalesPorRef(raw,"REM"), ka=Object.keys(a), kb=Object.keys(b); if(!ka.length||!kb.length) return false;
  var ig=0; ka.forEach(function(k){ if(b[k]===a[k]) ig++; }); return ig/Math.max(ka.length,kb.length)>=0.9;
}
/* Reparte los items segun la matriz del C.O.: cada referencia va a su auxiliar; se ordena por secuencia (ruta de alistamiento). */
function repartirPorMatriz(items,M,co){
  var activos={}; usuariosDe(co).forEach(function(u){ activos[u.id]=u; });
  var por={}, sin=[];
  items.forEach(function(it){
    var m=M[it.ref]||null, aux=m&&m.auxiliarId&&activos[m.auxiliarId]?m.auxiliarId:"";
    var seq=m?(parseDbl(m.secuencia)||parseDbl(m.ubicacion)||0):0;
    var x=Object.assign({},it,{seq:seq,zona:m&&m.zona?m.zona:""});
    if(aux){ (por[aux]=por[aux]||[]).push(x); } else { sin.push(x); }
  });
  function ord(a,b){ return (a.seq||1e9)-(b.seq||1e9) || (a.grupo<b.grupo?-1:a.grupo>b.grupo?1:0) || ordenRef(a.ref,b.ref); }
  Object.keys(por).forEach(function(k){ por[k].sort(ord); }); sin.sort(ord);
  return {por:por,sin:sin};
}
/* Peso y volumen: cajas x volumen de embalaje + sueltas x volumen individual (misma logica de la macro) */
function carga(items){
  var kg=0,cm3=0,sin=[],und=0,cj=0,su=0;
  items.forEach(function(it){
    var x=cajasSueltas(it.total,it.ue), m=S.mae[it.ref];
    und+=it.total; cj+=x.c; su+=x.s;
    if(m&&m.p>0&&m.vi>0&&m.ve>0){ kg+=it.total*m.p/1000; cm3+=x.c*m.ve+x.s*m.vi; } else sin.push(it.ref);
  });
  return {kg:kg,m3:cm3/1e6,und:und,cj:cj,su:su,sin:sin};
}
function avisosCarga(c){
  var of=c.sin.filter(function(r){ return /^OF/i.test(r); }), sp=c.sin.filter(function(r){ return !/^OF/i.test(r); }), h="";
  if(of.length) h+='<div class="hint warn" style="margin-top:8px"><b>'+of.length+' ofertas sin peso</b> (no suman al peso): '+esc(of.slice(0,6).join(", "))+(of.length>6?"…":"")+'.</div>';
  if(sp.length) h+='<div class="hint warn" style="margin-top:8px"><b>'+sp.length+' referencias sin peso o dimensiones</b> en el maestro (no suman al peso): '+esc(sp.slice(0,6).join(", "))+(sp.length>6?"…":"")+'</div>';
  return h;
}
function veredicto(c,cap,cob){
  var us=[]; if(cap&&cap.kg>0) us.push(c.kg/cap.kg); if(cap&&cap.m3>0) us.push(c.m3/cap.m3);
  if(!us.length) return {k:"sin",t:"Sin capacidad",cls:"info",u:null};
  if(cob!=null&&cob<S.umb.cob) return {k:"inc",t:"Datos incompletos",cls:"info",u:null};
  var u=Math.max.apply(null,us);
  if(u>S.umb.alto) return {k:"sob",t:"Sobrecargado",cls:"bad",u:u};
  if(u<S.umb.bajo) return {k:"des",t:"Desaprovechado",cls:"warn",u:u};
  return {k:"bien",t:"Bien aprovechado",cls:"ok",u:u};
}

/* La identidad vive en sessionStorage con el mismo formato que Semaforos: al pasar de una app a otra (en la misma pestaña) no se vuelve a pedir la clave. */
function leerIdentidad(){
  try{ var v=JSON.parse(sessionStorage.getItem(IDKEY)||sessionStorage.getItem(IDKEY_SEM)||"null"); return v&&v.id?v:null; }catch(e){ return null; }
}
function guardarIdentidad(me){ try{ var s=JSON.stringify({id:me.id,nombre:me.nombre,rol:me.rol,ciudad:me.ciudad,co:me.co}); sessionStorage.setItem(IDKEY,s); sessionStorage.setItem(IDKEY_SEM,s); }catch(e){} }

/* Datos de referencia compartidos: maestro, composicion de ofertas y marcas de desglose del C.O. */
async function cargarBase(force,coPedido){
  var co=coPedido||coActual(), p=[];
  if(force||!Object.keys(S.mae).length){
    p.push(DB.list("maestro",{all:true}).then(function(rows){ var m={}; rows.forEach(function(r){ m[r.id]=r.datos; }); S.mae=m; LS.set("ops_mae",m); }));
  }
  p.push(DB.list("ofertas",{all:true}).then(function(rows){ var o={}; rows.forEach(function(r){ if(r.datos&&r.datos.comps) o[r.id]={desc:r.datos.desc||"",comps:r.datos.comps}; }); S.ofr=o; LS.set("ops_ofr",o); }));
  /* marcas por ciudad (solo excepciones) y categoria global de cada oferta: de las 5 ciudades */
  p.push(DB.list("ofertas_desglose",{all:true}).then(function(rows){ var f={}; rows.forEach(function(r){ var d=r.datos; if(d&&d.oferta&&d.co){ (f[d.co]=f[d.co]||{})[d.oferta]=!!d.desglosar; } }); S.desg=f; }));
  p.push(DB.list("poblaciones",{all:true}).then(function(rows){ var c={}; rows.forEach(function(r){ c[r.id]=r.datos||{}; }); S.pobl=c; }));
  p.push(DB.list("ofertas_cat",{all:true}).then(function(rows){ var c={}; rows.forEach(function(r){ c[r.id]=r.datos||{}; }); S.cat=c; }));
  await Promise.all(p);
}
async function cargarMatriz(co,force){
  if(!force&&S.matriz[co]) return S.matriz[co];
  var rows=await DB.list("matrices/"+co+"/lineas",{all:true}), m={};
  rows.forEach(function(r){ m[r.id]=r.datos||{}; });
  S.matriz[co]=m; return m;
}
function loginComo(u){
  if(u.activo===false){ toast("Tu usuario está desactivado. Contacta al administrador."); return; }
  S.me={id:u.id,nombre:u.nombre,rol:u.rol,ciudad:u.ciudad,co:u.co};
  if(S.me.rol!=="administrador"){ S.coSel=S.me.co; }
  guardarIdentidad(S.me);
  var c=ciudadPorCo(S.me.co); if(c&&!LS.raw("ops_scanmode")) S.modoScan=c.scan;
  iniciarSesion();
}
async function iniciarSesion(){
  limpiarVistas(); reset("cargando");
  await cargarConfig();
  try{ if(esCoord()){ await cargarBase(); await cargarMatriz(coActual()).catch(function(){}); await cargarVeh().catch(function(){}); } }catch(e){ toast("No se pudieron cargar los datos base: "+(e.message||e)); }
  reset("home"); cargarHome();
}

/* ---------- escaner: lector RF (teclea el codigo) o camara ---------- */
function escanear(titulo,onCode){
  var bg=abrirSheet('<h3>'+esc(titulo)+'</h3>'+
    '<div class="row" style="margin:6px 0"><span class="chip '+(S.modoScan==="camara"?"sel":"")+' btn2" data-m="camara">Cámara</span><span class="chip '+(S.modoScan==="lector"?"sel":"")+' btn2" data-m="lector">Pistola / lector</span></div>'+
    '<div id="scArea"></div>'+
    '<label class="lb">Escribir el código manualmente</label><div class="row"><input id="scMan" type="text" inputmode="numeric" placeholder="Código de barras o referencia" class="grow"><button class="btn gold" id="scOk">Aceptar</button></div>'+
    '<div class="sp"></div><button class="btn ghost block" id="scX">Cancelar</button>');
  function fin(c){ if(!c) return; try{ if(zx) zx.reset(); }catch(e){} zx=null; bg.remove(); onCode(String(c).trim()); }
  function pintar(){
    var a=$("#scArea",bg);
    $$("[data-m]",bg).forEach(function(c){ c.classList.toggle("sel",c.getAttribute("data-m")===S.modoScan); });
    try{ if(zx) zx.reset(); }catch(e){} zx=null;
    if(S.modoScan==="lector"){
      a.innerHTML='<div class="hint">Dispare el lector sobre el producto: el código entra solo.</div><input id="scLec" type="text" inputmode="none" autocomplete="off" placeholder="Esperando lectura…" style="margin-top:8px">';
      var inp=$("#scLec",bg), t0=0, tm=null;
      function enviar(){ clearTimeout(tm); var c=inp.value.trim(); inp.value=""; if(c) fin(c); }
      inp.onkeydown=function(e){ if(e.key==="Enter"||e.key==="Tab"){ e.preventDefault(); enviar(); } };
      inp.oninput=function(){ var n=inp.value.length,now=Date.now(); if(n===1) t0=now; clearTimeout(tm); tm=setTimeout(function(){ var l=inp.value.length; if(l>=6&&t0&&(now-t0)/Math.max(l-1,1)<60) enviar(); },140); };
      setTimeout(function(){ inp.focus(); },80);
    } else {
      a.innerHTML='<div class="video"><video id="scVid" muted playsinline></video><div class="fr"></div></div><div id="scSt" class="small muted">Apunte la cámara al código de barras.</div>';
      if(window.ZXing&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
        try{
          zx=new ZXing.BrowserMultiFormatReader();
          var onf=function(r){ if(r) fin(r.getText()); };
          var cons={video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080},advanced:[{focusMode:"continuous"}]}};
          zx.decodeFromConstraints(cons,"scVid",onf).catch(function(){ return zx.decodeFromVideoDevice(null,"scVid",onf); }).catch(function(err){ var s=$("#scSt",bg); if(s) s.innerHTML='<span style="color:var(--bad)">No se pudo usar la cámara ('+esc(err&&err.name||"error")+'). Use la pistola o escriba el código.</span>'; });
        }catch(e){ $("#scSt",bg).textContent="El escáner no está disponible. Escriba el código."; }
      } else $("#scSt",bg).textContent="Cámara no disponible aquí (se necesita https). Escriba el código o use la pistola.";
    }
  }
  $$("[data-m]",bg).forEach(function(c){ c.onclick=function(){ S.modoScan=c.getAttribute("data-m"); LS.setRaw("ops_scanmode",S.modoScan); pintar(); }; });
  $("#scOk",bg).onclick=function(){ fin($("#scMan",bg).value); };
  $("#scMan",bg).onkeydown=function(e){ if(e.key==="Enter") fin(e.target.value); };
  $("#scX",bg).onclick=function(){ cerrarSheet(); };
  pintar();
}

/* Semaforos: avance por auxiliar leyendo sus cargas (colecciones "cargas" y "cargas/<id>/items" de la misma base) */
async function semaforosAvance(co,userId){
  var cargas=await DB.list("cargas",{all:true}); var vis=cargas.filter(function(c){ return !co||(c.datos&&c.datos.co===co); });
  vis.sort(function(a,b){ return String((b.datos||{}).creadoEn||"").localeCompare(String((a.datos||{}).creadoEn||"")); });
  vis=vis.slice(0,4); var out=[];
  for(var i=0;i<vis.length;i++){
    var c=vis[i], f=userId?{"datos->>asignadoA":"eq."+userId}:undefined;
    var items=await DB.list("cargas/"+c.id+"/items",{select:"id,a:datos->>asignadoA,e:datos->>estado",filter:f,all:true});
    var por={}; items.forEach(function(it){ var a=it.a||""; var x=por[a]=por[a]||{total:0,final:0,curso:0}; x.total++; if(it.e==="finalizado") x.final++; else if(it.e==="en_progreso") x.curso++; });
    var tot=0,fin=0,cur=0; Object.keys(por).forEach(function(a){ if(userId||a){ tot+=por[a].total; fin+=por[a].final; cur+=por[a].curso; } });
    if(userId&&!tot) continue;
    out.push({cargaId:c.id,titulo:"Semáforos · "+((c.datos||{}).ciudad||"")+((c.datos||{}).bodega?" · "+c.datos.bodega:"")+((c.datos||{}).creadoEn?" · "+String(c.datos.creadoEn).slice(0,10):""),co:(c.datos||{}).co,total:tot,final:fin,curso:cur,por:por});
  }
  return out;
}
function estadoSem(x){ return x.total&&x.final>=x.total?"completada":(x.final>0||x.curso>0)?"en_curso":"pendiente"; }
function semCardHtml(x,nombre){
  var est=estadoSem(x), cls=est==="completada"?"ok":est==="en_curso"?"curso":"";
  return '<button class="task '+cls+'" data-act="irsem"><div class="tt"><b>'+esc(x.titulo)+'</b>'+estadoChip(est)+'</div><div class="sub">Toma de semáforos de vencimiento'+(nombre?' · '+esc(nombre):'')+' · se trabaja en la app de Semáforos</div>'+barra(x.total?x.final/x.total:0,true)+'<div class="mini"><span class="chip">'+x.final+' de '+x.total+' referencias</span>'+(x.curso?'<span class="chip warn">'+x.curso+' en proceso</span>':'')+'<span class="chip sel">Abrir en Semáforos →</span></div></button>';

var MZ={co:"",cargando:false,err:"",plan:null,map:{},aplicando:false};
async function abrirMatriz(){
  MZ.co=coActual(); MZ.cargando=true; MZ.err=""; MZ.plan=null;
  try{ await cargarMatriz(MZ.co,true); }catch(e){ MZ.err=e.message||"Sin conexión"; }

}

  if(!its.length){ toast("No hay referencias sin auxiliar"); return; }

/* Matriz en Excel: Referencia, Descripcion, Secuencia y Auxiliar. "Oferta virtual" en Auxiliar = la oferta se maneja en Ofertas y no entra a la matriz.
   Zona, Ubicacion y Desglosar_Oferta son opcionales y por ahora no se usan. */
function claveMtz(r){ return r.aux||r.zona||""; }
function esOfVirtualAux(s){ return /^oferta/i.test(String(s||"").trim()); }
/* Reconocimiento de nombres: nombre completo exacto, o un nombre/apellido que identifique a UNA sola persona activa del C.O.
   Si no coincide con nadie, o coincide con varias, el archivo se rechaza. */
function tokensNom(s){ return normH(s).split(/[^a-z0-9ñ]+/).filter(Boolean); }
function reconocerAux(nombre,ops){
  var n=normH(nombre), ex=ops.filter(function(u){ return normH(u.nombre)===n; }); if(ex.length===1) return {id:ex[0].id};
  var t=tokensNom(nombre); if(!t.length) return {none:true};
  var c=ops.filter(function(u){ var ut=tokensNom(u.nombre); return t.every(function(x){ return ut.indexOf(x)>=0; }); });
  if(c.length===1) return {id:c[0].id,parcial:true};
  if(c.length>1) return {amb:c.map(function(u){ return u.nombre; })};
  return {none:true};
}
ACT.mzcargar=function(){
  elegirExcel(function(wb,f){
    var t=tablaDe(wb,["referencia"],"Matriz")||tablaDe(wb,["referencia"],"Zonas"); if(!t){ toast("No se encontró la columna Referencia"); return; }
    var p; try{ p=parseMatriz(t); }catch(e){ toast(e.message); return; }
    var co=coActual(), ops=usuariosDe(co,"operario").concat(usuariosDe(co,"coordinador")), map={}, claves={}, ofv=0, sinAux=0, rec=[], err=[];
    var rows=p.rows.filter(function(r){ if(esOfVirtualAux(r.aux)||esOfVirtualAux(r.zona)){ ofv++; return false; } return true; });
    rows.forEach(function(r){ var k=claveMtz(r); if(!k) sinAux++; else claves[k]=(claves[k]||0)+1; });
    Object.keys(claves).forEach(function(k){
      var x=reconocerAux(k,ops);
      if(x.id){ map[k]=x.id; rec.push({k:k,id:x.id,n:claves[k],parcial:!!x.parcial}); }
      else err.push({k:k,n:claves[k],amb:x.amb||null});
    });
    var M=S.matriz[co]||{}, nuevas=0, cambian=0, iguales=0, seen={};
    rows.forEach(function(r){ seen[r.ref]=1; var prev=M[r.ref]; if(!prev) nuevas++; else { var k=claveMtz(r), aux=k?(map[k]||""):(prev.auxiliarId||""); if((prev.auxiliarId||"")!==aux||(r.seq&&(prev.secuencia||0)!==r.seq)) cambian++; else iguales++; } });
    var fuera=Object.keys(M).filter(function(k){ return !seen[k]; }).length;
    MZ.plan={nombre:f.name,rows:rows,claves:claves,nuevas:nuevas,cambian:cambian,iguales:iguales,fuera:fuera,ofv:ofv,sinAux:sinAux,rec:rec,err:err,validos:ops.map(function(u){ return u.nombre; })};
    MZ.map=map; render();
  });
};

}

/* Aviso de empaque para el auxiliar: cambio pendiente de confirmar o aceptado en los ultimos 30 dias */
function avisoEmpaque(ref){
  var m=S.mae[ref]; if(!m) return "";
  if(m.empaqueNuevo) return "Empaque: el listado trae "+m.empaqueNuevo+" por caja (maestro "+(m.u||1)+")";
  var h=m.histEmpaque; if(h&&h.length){ var x=h[h.length-1]; if(Date.now()-Date.parse(x.fecha)<30*86400000) return "Empaque cambió: antes "+x.de+", ahora "+x.a+" por caja"; }
  return "";
}
function faltasMae(d){
  var f=[]; d=d||{};
  if(!d.d) f.push("descripción"); if(!d.b) f.push("barras"); if(!d.g||/^SIN /i.test(d.g)) f.push("grupo"); if(!d.l||/^SIN /i.test(d.l)) f.push("línea");
  if(!(d.p>0)) f.push("peso"); if(!(d.vi>0||d.ve>0)) f.push("volumen"); return f;
}
function resumenPendientes(co){
  var r={ofSin:0,ofSinComp:0,maeInc:0,maeEmp:0,mtzSin:null};
  try{ ofertasLista().forEach(function(k){ var c=S.cat[k]; if(!c||c.virtual==null) r.ofSin++; if(c&&c.virtual===true&&!S.ofr[k]) r.ofSinComp++; }); }catch(e){}
  Object.keys(S.mae).forEach(function(k){ if(faltasMae(S.mae[k]).length) r.maeInc++; if(S.mae[k].empaqueNuevo) r.maeEmp++; });
  var M=S.matriz[co]; if(M){ r.mtzSin=0; Object.keys(M).forEach(function(k){ if(!M[k].auxiliarId&&!esVirtual(k)) r.mtzSin++; }); }
  return r;
}

/* ===== Autoalimentacion: lo que llega en un listado se registra solo ===== */
async function registrarPendientes(items,co){
  var nuevosM=[], rellenar=[], nuevasL=[], M=await cargarMatriz(co);
  /* Proteccion: si alguna referencia no aparece en el maestro local, se vuelve a leer el maestro de la nube antes de decidir que es nueva
     (asi nunca se sobrescribe con datos en blanco un producto que ya existe) */
  if(items.some(function(it){ return it.ref&&!S.mae[it.ref]; })){
    var rows=await DB.list("maestro",{all:true}); if(rows){ var mm={}; rows.forEach(function(r){ mm[r.id]=r.datos; }); S.mae=mm; try{ LS.set("ops_mae",mm); }catch(e){} }
  }
  items.forEach(function(it){
    var k=String(it.ref||"").toUpperCase(); if(!k||esOferta(k,it.desc)) return;
    var lim=function(x){ return x&&!/^SIN /i.test(x)?x:""; }, prev=S.mae[it.ref];
    if(!prev) nuevosM.push({id:it.ref,datos:{d:it.desc||"",b:it.bar||"",u:it.ue||1,g:lim(it.grupo),l:lim(it.linea),p:it.p||0,vi:it.vi||0,ve:it.ve||0,origen:"listado",creadoEn:ahora()}});
    else { var c={}, ch=false, ue=it.ue>0?it.ue:0;
      if(ue>1&&(!prev.u||prev.u<=1)){ c.u=ue; ch=true; }
      else if(ue&&prev.u>1&&ue!==prev.u&&prev.empaqueIgnorado!==ue&&prev.empaqueNuevo!==ue){ c.empaqueNuevo=ue; c.empaqueDetectadoEn=ahora(); ch=true; }
      else if(ue&&ue===prev.u&&prev.empaqueNuevo){ c.empaqueNuevo=0; ch=true; } if(!prev.d&&it.desc){ c.d=it.desc; ch=true; } if(!prev.b&&it.bar){ c.b=it.bar; ch=true; } if((!prev.g||/^SIN /i.test(prev.g))&&lim(it.grupo)){ c.g=it.grupo; ch=true; } if((!prev.l||/^SIN /i.test(prev.l))&&lim(it.linea)){ c.l=it.linea; ch=true; } if(!(prev.p>0)&&it.p>0){ c.p=it.p; c.vi=it.vi||prev.vi||0; c.ve=it.ve||prev.ve||0; ch=true; } if(ch) rellenar.push({id:it.ref,datos:Object.assign({},prev,c)}); }
    if(!M[it.ref]) nuevasL.push({id:it.ref,datos:{referencia:it.ref,descItem:it.desc||(prev&&prev.d)||"",zona:"",ubicacion:"",secuencia:0,auxiliarId:"",origen:"listado",actualizadoEn:ahora(),actualizadoPor:S.me?S.me.id:""}});
  });
  if(nuevosM.length||rellenar.length) await DB.setMany("maestro",nuevosM.concat(rellenar));
  nuevosM.concat(rellenar).forEach(function(n){ S.mae[n.id]=n.datos; });
  if(nuevasL.length){ await DB.setMany("matrices/"+co+"/lineas",nuevasL); S.matriz[co]=S.matriz[co]||{}; nuevasL.forEach(function(n){ S.matriz[co][n.id]=n.datos; }); }
  return {maestro:nuevosM.length,completados:rellenar.length,matriz:nuevasL.length};
}

var VH={q:"",cargando:false,err:""};

async function cargarVeh(){
  var co=coActual(); VH.cargando=true; VH.err="";

    var rows=await DB.list("vehiculos",{filter:{"datos->>co":"eq."+co},all:true});

/* Estado de un documento por su fecha de vencimiento */
function estadoDoc(f){
  if(!f) return {k:"falta",t:"Falta",cls:"st-nov"};
  var dias=Math.floor((Date.parse(f+"T23:59:59")-Date.now())/86400000);
  if(isNaN(dias)) return {k:"falta",t:"Falta",cls:"st-nov"};
  if(dias<0) return {k:"venc",t:"Vencido",cls:"bad"};
  if(dias<=6) return {k:"urg",t:(dias===0?"Vence hoy":"Vence en "+(dias+1)+" d"),cls:"bad"};
  if(dias<=30) return {k:"porv",t:"Vence en "+(dias+1)+" d",cls:"warn"};
  return {k:"ok",t:"Vigente",cls:"st-ok"};
}
function faltasVeh(d){
  var f=[]; d=d||{};
  if(!d.conductor) f.push("nombre del conductor");
  if(!d.soat) f.push("SOAT"); if(!d.tecno) f.push("tecnomecánica"); if(!d.manip) f.push("manipulación de alimentos");
  return f;
}
function alertaVeh(d){ var e=[estadoDoc(d.soat),estadoDoc(d.tecno),estadoDoc(d.manip)]; return e.some(function(x){ return x.k==="venc"||x.k==="urg"||x.k==="porv"; }); }
/* Alerta de una semana: vehiculos con algun documento vencido o que vence en 7 dias o menos */
function vehUrgentes(){
  var out=[]; S.vehList.forEach(function(v){ var d=v.d, docs=[["SOAT",d.soat],["Tecnomecánica",d.tecno],["Manipulación de alimentos",d.manip]], ap=[];
    docs.forEach(function(x){ if(!x[1]) return; var e=estadoDoc(x[1]); if(e.k==="venc"||e.k==="urg") ap.push(x[0]+": "+(e.k==="venc"?"vencido":e.t.toLowerCase())); });
    if(ap.length) out.push({placa:d.placa,conductor:d.conductor||"",ap:ap}); });
  return out;
}
function alertaVehHtml(){
  var u=vehUrgentes(); if(!u.length) return "";
  return '<div class="hint warn" style="margin:0 0 12px;border:2px solid #c0392b"><b style="color:#c0392b">⚠ Documentos de vehículos por vencer (7 días o menos)</b>'+u.map(function(x){ return '<div class="row" style="margin-top:6px;align-items:flex-start"><span class="mono"><b>'+esc(x.placa)+'</b></span><span class="small grow">'+esc(x.ap.join(" · "))+(x.conductor?' · '+esc(x.conductor):"")+'</span></div>'; }).join("")+'<div class="sp"></div><button class="btn sm" data-act="ir" data-v="vehiculos">Ver vehículos</button></div>';
}

var AYUDA_CUBICAJE='<div class="hint" style="margin:6px 0"><b>¿Cómo se saca la cubicación?</b><br>Mide el <b>interior</b> de la carrocería (el espacio donde va la carga), en metros:<br>• <b>Largo:</b> de la pared del fondo a las puertas.<br>• <b>Ancho:</b> de pared a pared (si hay pasos de rueda, mide entre ellos).<br>• <b>Alto:</b> del piso al techo.<br>Cubicación (m³) = largo × ancho × alto. Ejemplo: 4,20 × 2,10 × 2,00 = 17,64 m³.<br><br><b>Capacidad de carga (kg):</b> no se mide, se copia de la <b>tarjeta de propiedad</b> del vehículo.</div>';

/* Una sesion por centro de operacion: cada linea se asigna por el prefijo de su bodega (06 Pereira, 07 Armenia…) */
async function crearSesiones(todas,detalle,omit,err){
  NUEVA={creando:true,msg:"Leyendo "+nf(todas.length)+" líneas…",errores:err}; render();
  try{
    var defecto=esAdmin()?S.coSel:S.me.co, porCo={}, fuera=0;
    todas.forEach(function(l){ var c=coDeBodega(l.bod)||defecto; if(!esAdmin()&&c!==S.me.co){ fuera++; return; } (porCo[c]=porCo[c]||[]).push(l); });
    var cos=Object.keys(porCo); if(!cos.length){ NUEVA={errores:err.concat(["Ninguna línea corresponde a tu centro de operación."])}; render(); return; }
    var creadas=[];
    for(var i=0;i<cos.length;i++){
      var co=cos[i], cn=(ciudadPorCo(co)||{nombre:co}).nombre;
      NUEVA.msg="Creando la sesión de "+cn+"…"; render();
      await cargarBase(false,co).catch(function(){});
      await registrarCiudades(porCo[co],co).catch(function(){});
      await registrarOfertas(porCo[co],"listado",co).catch(function(){ return 0; });
      var r=await crearSesionDe(armarSesion(porCo[co],co,mismosProductos(porCo[co])),detalle);
      creadas.push(r);
    }
    var ofn=creadas.reduce(function(s,x){ return s+(x.reg&&x.reg.matriz||0); },0), pm=creadas.reduce(function(s,x){ return s+(x.reg&&x.reg.maestro||0); },0);
    if(esAdmin()){ S.coSel=creadas[0].co; LS.setRaw("ops_cosel",S.coSel); S.matriz={}; }
    NUEVA={};
    toast((creadas.length>1?creadas.length+" sesiones creadas (una por ciudad)":"Sesión creada")+(omit?" · "+omit+" documentos repetidos contados una vez":"")+(EXCL?" · "+nf(EXCL)+" líneas omitidas (solo se alistan remisiones SM, TBV y TCA)":"")+(fuera?" · "+nf(fuera)+" líneas de otras ciudades omitidas":"")+(pm?" · "+pm+" productos nuevos al maestro":"")+(ofn?" · "+ofn+" referencias nuevas pendientes de asignar":""),6000);
    nav.pop();
    if(creadas.length===1){ SESV={id:creadas[0].sid,cargando:true,err:"",ses:null,tareas:[]}; go("ses"); cargarSes(); }
    else { go("ali"); cargarAli(); }
  }catch(e){ NUEVA={errores:err.concat(["No se pudo crear la sesión: "+(e.message||e)])}; render(); toast("No se pudo crear la sesión: "+(e.message||e),4500); }
}
function armarSesion(raw,co,iguales){
  var lineas=raw.filter(function(l){ return !(iguales&&l.t==="REQ"); }), des=desglosar(lineas,co), dd={}; lineas.forEach(function(l){ if(l.doc) dd[l.doc]=1; });
  var items=consolidar(des.lineas), g={}, ciu={}, dl={};
  lineas.forEach(function(l){ if(!l.doc) return; var k=String(l.doc).replace(/\s+/g,""), x=dl[k]=dl[k]||{t:l.t||"",cli:"",ciu:"",l:[]}; if(!x.cli&&l.cli) x.cli=l.cli; if(!x.ciu&&l.ciu) x.ciu=l.ciu; x.l.push([l.ref,l.desc,l.bar,l.ue,l.cant]); });
  lineas.forEach(function(l){ var k=l.ciu||"SIN CIUDAD"; (g[k]=g[k]||[]).push(l); });
  Object.keys(g).forEach(function(k){ ciu[k]=consolidar(desglosar(g[k],co).lineas).map(function(x){ return [x.ref,x.total]; }); });
  return {co:co,des:des,items:items,docs:Object.keys(dd).length,unid:items.reduce(function(s,x){ return s+x.total; },0),ciu:ciu,dl:dl,bod:(lineas.filter(function(l){ return l.bod; })[0]||{}).bod||""};
}
async function crearSesionDe(N,detalle){
  var M=await cargarMatriz(N.co), rep=repartirPorMatriz(N.items,M,N.co), co=N.co, ciudad=(ciudadPorCo(co)||{nombre:co}).nombre;
  /* Lo que la matriz no asigna se reparte equitativamente entre los auxiliares activos del C.O. (el que va con menos referencias recibe primero) */
  var auxs=usuariosDe(co,"operario").filter(function(u){ return !PART.ex[u.id]; });
  if(rep.sin.length&&auxs.length){
    var carga0={}; auxs.forEach(function(u){ var l=rep.por[u.id]||[]; carga0[u.id]={n:l.length,u:l.reduce(function(s,x){ return s+(x.total||0); },0)}; });
    rep.sin.slice().sort(function(a,b){ return (b.total||0)-(a.total||0); }).forEach(function(it){
      var mejor=auxs[0].id; auxs.forEach(function(u){ var a=carga0[u.id], b=carga0[mejor]; if(a.n<b.n||(a.n===b.n&&a.u<b.u)) mejor=u.id; });
      (rep.por[mejor]=rep.por[mejor]||[]).push(it); carga0[mejor].n++; carga0[mejor].u+=(it.total||0);
    });
    rep.sin=[]; Object.keys(rep.por).forEach(function(k){ rep.por[k].sort(function(a,b){ return (a.seq||1e9)-(b.seq||1e9)||ordenRef(a.ref,b.ref); }); });
  }
  var titulo="Alistamiento "+ciudad+" "+hoy(), sid="S"+hoy().slice(2).replace(/-/g,"")+"-"+rid(3);
  var reg={maestro:0,completados:0,matriz:0}; try{ reg=await registrarPendientes(N.items,co); }catch(e){}
  N.items.forEach(function(it){ it.cemp=avisoEmpaque(it.ref); });
  var docs=Object.keys(rep.por).map(function(a){ return tareaDoc("alistamiento",sid,titulo,co,a,rep.por[a]); });
  if(rep.sin.length) docs.push(tareaDoc("alistamiento",sid,titulo,co,"",rep.sin));
  await DB.set("ops_sesiones",sid,{modulo:"alistamiento",co:co,ciudad:ciudad,titulo:titulo,fecha:hoy(),creadoPor:S.me.nombre,creadoPorId:S.me.id,creadoEn:ahora(),totalRefs:N.items.length,totalUnidades:N.unid,docs:N.docs,bod:N.bod,ciu:N.ciu,archivos:detalle.map(function(a){ return {n:a.n,t:a.t,l:a.l}; })});
  await DB.setMany("ops_tareas",docs);
  /* lineas por documento: Despacho las toma de aqui, sin volver a cargar los archivos */
  try{ var dk=Object.keys(N.dl||{}); if(dk.length) await DB.setMany("ops_docs",dk.map(function(k){ return {id:k,datos:{co:co,sid:sid,t:N.dl[k].t,cli:N.dl[k].cli,ciu:N.dl[k].ciu||"",l:N.dl[k].l}}; })); }catch(e){}
  
  return {sid:sid,co:co,docs:docs.length,reg:reg};
}

}
function rcOrden(a,b){
  var f=function(it){ var c=it.ue>1?Math.floor(it.esp/it.ue):0; return {c:c,s:it.esp-c*(it.ue>1?it.ue:1)}; }, x=f(a), y=f(b);
  if((x.c>0)!==(y.c>0)) return x.c>0?-1:1; if(x.c!==y.c) return y.c-x.c; if(x.s!==y.s) return y.s-x.s; return ordenRef(a.ref,b.ref);
}

async function rcGuardar(ref,modo,v){
  try{
    var r=await DB.get("ops_tareas",RC.t.id); if(!r) return {err:"El recibo ya no existe"}; var d=r.datos;
    if(d.estado==="completada") return {err:"Este recibo ya está cerrado"};
    var it=(d.items||[]).filter(function(a){ return a[0]===ref; })[0]; if(!it) return {err:"Esa referencia no está en el recibo"};
    var cont=d.cont||{}, nv=modo==="set"?v:(cont[ref]||0)+v;
    if(nv>it[4]) return {err:"Supera lo que debía llegar de esta referencia. No se puede recibir de más: revisa el conteo o informa al coordinador."};
    if(nv>0) cont[ref]=nv; else delete cont[ref];
    var ok=Object.keys(cont).length, estado=ok>0?"en_curso":"pendiente";
    await DB.patch("ops_tareas",RC.t.id,{cont:cont,ok:ok,estado:estado,actualizadoEn:ahora(),actualizadoPor:S.me.id});
    d.cont=cont; d.ok=ok; d.estado=estado; RC.t.d=d; return {};
  }catch(e){ return {err:"No se pudo guardar: "+(e.message||e)}; }
}

/* ---------- rutas por poblacion y listado de separacion impreso (para bodegas sin RF ni matriz formal) ---------- */
function claveCiu(c){ return normH(c).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""); }
function rutaDe(ciu){ var p=S.pobl[claveCiu(ciu)]; return (p&&p.ruta)||"SIN RUTA"; }
/* Las poblaciones nuevas que llegan en un listado se registran solas (sin ruta) para asignarles ruta a mano */
/* Poblaciones por ciudad: cada coordinador ve solo las poblaciones que han llegado en documentos de su centro de operacion */
var CIUCO={};
function visRuta(k){
  if(esAdmin()) return true; var p=S.pobl[k]||{}, co=coActual();
  if(p.cos&&p.cos.indexOf(co)>=0) return true;
  return !!(CIUCO[co]&&CIUCO[co][k]);
}
async function cargarCiuCo(){
  var co=coActual(), rs=await DB.list("ops_sesiones",{filter:{"datos->>co":"eq."+co},all:true}), m={};
  rs.forEach(function(r){ Object.keys((r.datos&&r.datos.ciu)||{}).forEach(function(c){ m[claveCiu(c)]=1; }); });
  CIUCO[co]=m;
}
async function registrarCiudades(lineas,co){
  var cambios=[], vistos={}; lineas.forEach(function(l){ var c=String(l.ciu||"").trim(), k=claveCiu(c); if(!k||vistos[k]) return; vistos[k]=1;
    var p=S.pobl[k];
    if(!p) cambios.push({id:k,datos:{ciudad:c,ruta:"",origen:"listado",cos:co?[co]:[],creadoEn:ahora()}});
    else if(co&&(p.cos||[]).indexOf(co)<0) cambios.push({id:k,datos:Object.assign({},p,{cos:(p.cos||[]).concat([co])})}); });
  if(!cambios.length) return 0; await DB.setMany("poblaciones",cambios); cambios.forEach(function(n){ S.pobl[n.id]=n.datos; }); return cambios.length;
}

  if($("#rtDel",bg)) $("#rtDel",bg).onclick=function(){ borrarUno("poblaciones",k,"la población "+p.ciudad,function(){ delete S.pobl[k]; cerrarSheet(); render(); }); };

function qty(n){ return n>0?'<div class="qc"><span class="bx">☐</span><b>'+nf(n)+'</b></div>':'<div class="qc"><span></span><b>0</b></div>'; }
var LST={ruta:"",piso:""}, LSD={ses:null,tareas:[],M:{}};
function sugerirVehiculo(kg,m3){
  if(kg<=3000&&m3<=18) return "Turbo"; if(kg<=8000&&m3<=35) return "Sencillo"; if(kg<=17000&&m3<=50) return "Doble Troque";
  return "Supera Doble Troque (validar vehículo mayor)";
}
/* El listado sale de la sesion ya creada: las tareas (con su auxiliar), el desglose por poblacion y la matriz vigente */
function listadoCalc(){
  var ses=LSD.ses||{}, M=LSD.M||{}, ciu=ses.ciu||{}, items=[], porRuta=null;
  /* sesiones creadas antes de guardar la bodega: se deduce del centro de operacion (06001, 07001, 08001…) */
  var cc=ciudadPorCo(ses.co), bodSes=ses.bod||(cc?cc.pref+"001":"");
  if(LST.ruta){ porRuta={}; Object.keys(ciu).forEach(function(c){ if(rutaDe(c)!==LST.ruta) return; ciu[c].forEach(function(a){ porRuta[a[0]]=(porRuta[a[0]]||0)+a[1]; }); }); }
  LSD.tareas.forEach(function(t){ var aux=t.datos.asignadoId||""; (t.datos.items||[]).forEach(function(a){
    var tot=a[4]; if(porRuta){ tot=porRuta[a[0]]||0; if(!(tot>0)) return; }
    items.push({ref:a[0],desc:a[1],bar:a[2],ue:a[3],total:tot,seq:(M[a[0]]&&M[a[0]].secuencia)||a[8]||0,aux:aux,bod:bodSes}); }); });
  if(LST.piso) items=items.filter(function(it){ return LST.piso==="__sin"?!it.aux:it.aux===LST.piso; });
  var conSeq=items.some(function(it){ return it.seq>0; });
  items.sort(function(a,b){ if(conSeq){ var x=a.seq||1e9, y=b.seq||1e9; if(x!==y) return x-y; } return ordenRef(a.ref,b.ref); });
  var t={cajas:0,sueltas:0,kg:0,m3:0,sin:[],unid:0};
  items.forEach(function(it){
    var ue=it.ue>1?it.ue:1, c=ue>1?Math.floor(it.total/ue):0, s=it.total-c*ue; it._c=c; it._s=s; t.cajas+=c; t.sueltas+=s; t.unid+=it.total;
    var m=S.mae[it.ref]; if(m&&m.p>0&&(m.vi>0||m.ve>0)){ t.kg+=it.total*m.p/1000; t.m3+=(c*(m.ve||m.vi*ue)+s*(m.vi||0))/1e6; } else t.sin.push(it.ref);
  });
  return {items:items,t:t,M:M,conUbic:items.some(function(it){ return (M[it.ref]||{}).ubicacion; })};
}

  var main='<p class="small muted">'+nf(lista.length)+' poblaciones</p>'+lista.slice(0,300).map(function(k){ var p=S.pobl[k]; return '<button class="task" data-act="rtabrir" data-k="'+esc(k)+'"><div class="tt"><b>'+esc(p.ciudad)+'</b>'+(p.ruta?'<span class="chip st-ok">'+esc(p.ruta)+'</span>':'<span class="chip st-nov">Sin ruta</span>')+'</div></button>'; }).join("")+(lista.length?'':'<div class="empty">No hay poblaciones'+(RT.f==="sin"?" sin ruta":"")+'.</div>');
  layoutAdmin(cab,side,main); enlazarBuscador("rtq",function(x){ RT.q=x; });
};
ACT.rtborrar=async function(){
  var ls=rutasFiltradas(); if(!ls.length){ toast("No hay poblaciones en la lista"); return; } var todos=ls.length===Object.keys(S.pobl).length;
  if(!pedirBorrado("¿Eliminar "+nf(ls.length)+" población"+(ls.length>1?"es":"")+" con su ruta?"+(todos?" Son TODAS.":"")+" Si vuelven a llegar en un listado se registrarán de nuevo, sin ruta.",ls.length)) return;
  try{ toast("Eliminando…",6000); await borrarIdsDe("poblaciones",ls,false); ls.forEach(function(k){ delete S.pobl[k]; }); toast(nf(ls.length)+" poblaciones eliminadas"); render(); }
  catch(e){ toast("No se pudo eliminar: "+(e.message||e),4500); }
};

/* ===== Usuarios (no se eliminan a si mismo ni a los administradores en bloque) ===== */
function usFiltrados(){
  var q=normH(US.q);
  return S.users.filter(function(u){ return (US.f==="todos"||(US.f==="activos")===(u.activo!==false))&&(!q||normH(u.nombre+" "+(u.cargo||"")).indexOf(q)>=0); });
}
VIEWS.usuarios=function(){
  topbar("Usuarios y roles",subtituloUsuario(),true);
  var cnt={administrador:0,coordinador:0,operario:0}, inact=0; S.users.forEach(function(u){ if(u.activo!==false) cnt[u.rol]=(cnt[u.rol]||0)+1; else inact++; });
  var lista=usFiltrados(), borrables=lista.filter(function(u){ return u.id!==S.me.id&&u.rol!=="administrador"; });
  var cab='<h1>Usuarios y roles</h1><p class="muted small">Los mismos usuarios y claves de Semáforos: un solo ingreso para todas las apps. Toca un usuario para editarlo, desactivarlo, eliminarlo o restablecer su clave.</p>';
  var side='<div class="kpis kp2"><div class="kpi"><b>'+cnt.administrador+'</b><span>Administradores</span></div><div class="kpi"><b>'+cnt.coordinador+'</b><span>Coordinadores</span></div><div class="kpi"><b>'+cnt.operario+'</b><span>Auxiliares</span></div></div>'+
    '<div class="sp"></div><button class="btn gold block" data-act="usnuevo">+ Agregar usuario</button><div class="sp"></div>'+BTN_BORRAR+'data-act="usborrar" '+(borrables.length?'':'disabled')+'>Eliminar los '+nf(borrables.length)+' de la lista</button><p class="small muted">En bloque no se eliminan administradores ni tu propio usuario.</p>'+
    '<label class="lb">Mostrar</label><div class="seg vseg">'+[["activos","Activos"],["inactivos","Inactivos ("+inact+")"],["todos","Todos"]].map(function(f){ return '<span class="chip btn2 '+(US.f===f[0]?"sel":"")+'" data-act="usfiltro" data-f="'+f[0]+'">'+f[1]+'</span>'; }).join("")+'</div>'+
    '<label class="lb">Buscar</label><input type="search" id="usq" placeholder="Nombre o cargo" value="'+esc(US.q)+'">';
  var main="", hay=false;
  CIUDADES.concat([{co:"REG",nombre:REGIONAL.nombre}]).forEach(function(c){
    var l=lista.filter(function(u){ return u.co===c.co; }).sort(function(a,b){ var o={administrador:0,coordinador:1,operario:2}; return (o[a.rol]-o[b.rol])||String(a.nombre).localeCompare(String(b.nombre)); });
    if(!l.length) return; hay=true;
    main+='<p class="grp-titulo">'+esc(c.nombre)+(c.co!=="REG"?' · C.O. '+c.co:'')+'</p>'+l.map(function(u){
      var cl=u.rol==="administrador"?'<span class="chip">Clave propia</span>':US.claves==null?'':tieneClaveU(u)?'<span class="chip st-ok">Clave creada</span>':'<span class="chip st-nov">Sin clave</span>';
      return '<div class="user-row" data-act="usabrir" data-id="'+esc(u.id)+'" style="'+(u.activo===false?'opacity:.55':'')+'"><div class="avatar">'+esc(iniciales(u.nombre))+'</div><div class="grow"><div class="nm">'+esc(u.nombre)+(u.id===S.me.id?' <small>(tú)</small>':'')+'</div><div class="rl">'+esc(ROL_LABEL[u.rol]||u.rol)+(u.cargo?' · '+esc(u.cargo):'')+'</div></div>'+(u.activo===false?'<span class="chip">Inactivo</span>':cl)+'</div>';
    }).join("");
  });
  if(!hay) main='<div class="empty">No hay usuarios con este filtro.</div>';
  layoutAdmin(cab,side,main); enlazarBuscador("usq",function(x){ US.q=x; });
};
ACT.usborrar=async function(){
  var ls=usFiltrados().filter(function(u){ return u.id!==S.me.id&&u.rol!=="administrador"; }); if(!ls.length){ toast("No hay usuarios para eliminar en la lista"); return; }
  if(!pedirBorrado("¿Eliminar "+nf(ls.length)+" usuario"+(ls.length>1?"s":"")+"? Pierden el acceso a todas las apps, incluido Semáforos. Lo que ya registraron no se borra.",ls.length)) return;
  try{ toast("Eliminando…",6000); await borrarIdsDe("usuarios",ls.map(function(u){ return u.id; }),false); await cargarUsuarios(); toast(nf(ls.length)+" usuarios eliminados"); render(); }
  catch(e){ toast("No se pudo eliminar: "+(e.message||e),4500); }
};

/* ===== 99_boot.js ===== */
/* ---------- eventos, carga al entrar a cada pantalla, actualizacion automatica y arranque ---------- */
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]"); if(!el) return;
  var f=ACT[el.getAttribute("data-act")]; if(!f) return;
  f(el,function(k){ return el.getAttribute("data-"+k); });
});
function alEntrar(v){
  try{
    if(v==="tablero"){ TB.datos=null; TB.co=""; cargarTablero(); }
    else if(v==="ali") cargarAli();
    else if(v==="desp") cargarDesp();
    else if(v==="matriz") abrirMatriz();
    else if(v==="usuarios"){ cargarUsuarios().then(function(){ var c=cur(); if(c&&c.v==="usuarios") render(); }).catch(function(){}); cargarClaves(); }
    else if(v==="vehiculos") cargarVeh();
    else if(v==="enrut") cargarEnr();
    else if(v==="recibos") cargarRecibos();
    else if(v==="rutas") Promise.all([cargarBase(false),cargarCiuCo()]).then(function(){ var c=cur(); if(c&&c.v==="rutas") render(); }).catch(function(){});
    else if(v==="ofertas"||v==="maestro") cargarBase(false).then(function(){ var c=cur(); if(c&&c.v===v) render(); }).catch(function(){});
  }catch(e){}
}
ACT.reintentar=function(){ S.loginErr=""; arrancar(); };
/* Actualizacion automatica cada 15 s en las pantallas de seguimiento (sin pisar lo que se esta escribiendo) */
setInterval(function(){
  if(!S.me||document.hidden) return; var c=cur(); if(!c) return;
  var a=document.activeElement; if(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) return;
  if($(".sheet-bg")) return;
  try{
    if(c.v==="home"&&S.me.rol==="operario") cargarHome();
    else if(c.v==="tablero") cargarTablero();
    else if(c.v==="trab") refrescarCompartida();
    else if(c.v==="ses") cargarSes();
    else if(c.v==="ali") cargarAli();
    else if(c.v==="desp"||c.v==="placa") cargarDesp();
    else if(c.v==="recibos") cargarRecibos();
    else if(c.v==="recibo") rcRefrescar();
  }catch(e){}
},15000);
async function arrancar(){
  if(LS.raw("ops_tema")==="dark") document.documentElement.classList.add("dark");
  if(!NUBE){ reset("login"); return; }
  reset("login");
  try{ await cargarUsuarios(); }catch(e){ S.loginErr="No se pudo conectar: "+(e.message||e); render(); return; }
  var id=leerIdentidad();
  if(id){
    var u=S.users.filter(function(x){ return x.id===id.id; })[0];
    if(u&&u.activo!==false){ loginComo(u); return; }
    borrarIdentidad();
  }
  render();
}
arrancar();

})();
</script>
