<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Operaciones Dislicores</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --gold:#c2aa5b; --gold-light:#d4bf7a; --gold-dark:#a89245; --gold-translucent:#c2aa5b1f;
  --black:#0a0a0a; --black-card:#1a1a1a; --white:#fff;
  --gray-50:#f7f6f4; --gray-100:#f0ede8; --gray-200:#e2ddd6; --gray-300:#c8c2b8; --gray-400:#9e9890; --gray-500:#726d66; --gray-600:#4a4640;
  --bg:var(--gray-50); --card:#fff; --border:var(--gray-200); --text:#1a1a1a; --muted:var(--gray-500);
  --ok:#2e8b57; --ok-bg:#e4f3ea; --warn:#b8860b; --warn-bg:#fbf1d9; --bad:#c4453a; --bad-bg:#fae7e4; --info-bg:#eef0f3;
  --shadow:0 2px 8px #0000000f; --radius:16px;
  --font:"DM Sans",system-ui,-apple-system,sans-serif; --mono:"JetBrains Mono","Fira Code",monospace;
}
html.dark{
  --bg:#0f0e0c; --card:#1a1916; --border:#2e2b26; --text:#f0ece4; --muted:#8a8378;
  --gray-100:#1a1916; --gray-200:#2e2b26; --gray-300:#3d3930; --gray-400:#6b6560; --gray-500:#8a8378; --gray-600:#b0a898;
  --ok-bg:#16281d; --warn-bg:#2f2814; --bad-bg:#2f1b17; --info-bg:#221f1b; --shadow:0 2px 8px #0006;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.35}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
#top{position:sticky;top:0;z-index:20;background:var(--black);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
#top .logo{font-size:11px;letter-spacing:.22em;font-weight:600;color:var(--gold)}
#top .tt{flex:1;min-width:0}
#top .tt b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .tt span{font-size:11.5px;color:#bdb6a6}
.ib{background:#ffffff14;border:0;color:#fff;border-radius:12px;padding:8px 11px;font-weight:600;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:21px;margin:6px 0 4px} h2{font-size:16px;margin:18px 0 8px} p{margin:6px 0}
.muted{color:var(--muted)} .small{font-size:12.5px} .mono{font-family:var(--mono)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin:10px 0;box-shadow:var(--shadow)}
.card.gold{border-left:4px solid var(--gold)}
.tile{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:var(--radius);padding:14px;margin:10px 0;cursor:pointer;box-shadow:var(--shadow)}
.tile .ic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--black);color:var(--gold);display:grid;place-items:center;font-size:21px}
.tile b{display:block;font-size:16px} .tile span{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--black);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}
html.dark .btn{background:var(--gold);color:#17130e}
.btn.gold{background:var(--gold);color:#17130e} .btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--border)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px} .btn.block{display:flex;width:100%} .btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.red{background:var(--bad);color:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .grow{flex:1;min-width:0} .row>b.grow{flex:1 1 110px;min-width:110px} .sp{height:8px}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:12px;background:var(--card);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
label.lb{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 5px;text-transform:uppercase;letter-spacing:.04em}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--gray-100);color:var(--gray-600);border:1px solid transparent}
.chip.sel{background:var(--gold-translucent);color:var(--gold-dark);border-color:var(--gold)} .chip.btn2{cursor:pointer}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.info{background:var(--info-bg);color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--gray-200);overflow:hidden} .bar i{display:block;height:100%;background:var(--gold)}
.bar.u i{background:var(--ok)} .bar.w i{background:var(--warn)} .bar.b i{background:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px} .kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 12px}
.kpi b{display:block;font-size:22px;font-family:var(--mono)} .kpi span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.line{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--gray-300);border-radius:14px;padding:10px 12px;margin:7px 0;cursor:pointer}
.line.ok{border-left-color:var(--ok);opacity:.78} .line.parc{border-left-color:var(--warn)} .line.no{border-left-color:var(--bad)}
.line .r{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--gold-dark)} .line .d{font-size:14px;font-weight:600;margin:1px 0 4px}
.line .q{margin-left:auto;text-align:right;white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:15px}
.sheet-bg{position:fixed;inset:0;background:#0a0a0acc;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 4px;font-size:18px}
.big{font-family:var(--mono);font-weight:700;font-size:30px;line-height:1.1}
.video{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3;margin:8px 0} .video video{width:100%;height:100%;object-fit:cover}
.video .fr{position:absolute;inset:18% 10%;border:2px solid var(--gold);border-radius:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:12px;z-index:90;font-weight:600;max-width:90vw;box-shadow:0 8px 24px #0006}
table{width:100%;border-collapse:collapse;font-size:13px} th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:6px 6px;border-bottom:1px solid var(--border)} td{padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:middle}
td input{padding:7px 8px;border-radius:9px;width:84px}
.hint{background:var(--info-bg);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted)} .hint.warn{background:var(--warn-bg);color:var(--warn)}
.tabs{display:flex;gap:6px;overflow:auto;padding-bottom:4px;margin:10px 0;align-items:flex-start;-webkit-overflow-scrolling:touch}
.tabs .chip{flex:none;white-space:nowrap;align-self:flex-start;padding:7px 12px}
#top .tt span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hide{display:none!important}
@media(min-width:760px){ .sheet{border-radius:22px;margin-bottom:6vh} .sheet-bg{align-items:center} }
</style>
</head>
<body>
<div id="top"></div>
<main id="app"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
<script>
(function(){
'use strict';
/* =====================================================================
   OPERACIONES DISLICORES - prototipo v0.1 (alistamiento, despacho y enlace a semaforos)
   Todo corre en el dispositivo: los datos NO se envian a ningun servidor.
   Del Excel solo se guardan columnas de producto y cantidades; se descartan clientes, NIT,
   sucursales, condiciones de pago, valores y demas datos no necesarios.
   ===================================================================== */
var VERSION = "0.2";
/* Nube opcional (Supabase). Se inyectan al publicar (publicar.ps1); vacíos = la app funciona sin nube.
   Solo debe ir la clave PUBLISHABLE (sb_publishable_...). Nunca claves secret ni service_role. */
var SUPA_URL = "https://fbivjzmvtyxvtiovsskk.supabase.co";
var SUPA_KEY = "sb_publishable_zKpd8ztloRQKL_bm8pa1IA_fD_eJLkz";
var NUBE = !!(SUPA_URL && SUPA_KEY);
var SEMAFOROS_URL = "https://geanolte.github.io/semaforos-vencimiento/";

/* ---------- utilidades ---------- */
function $(s,r){ return (r||document).querySelector(s); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
var LS = {
  get:function(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set:function(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ toast("No se pudo guardar en este dispositivo (memoria llena)"); return false; } },
  raw:function(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  setRaw:function(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
function toast(m){ var t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.appendChild(t); setTimeout(function(){ t.remove(); },2600); }
function normH(s){ return String(s==null?"":s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim(); }
function parseDbl(v){
  if(v==null||v==="") return 0;
  if(typeof v==="number") return isFinite(v)?v:0;
  var s=String(v).trim(); if(!s) return 0;
  if(/^-?\d+(\.\d+)?$/.test(s)) return parseFloat(s);
  s=s.replace(/\./g,"").replace(",","."); var n=parseFloat(s); return isFinite(n)?n:0;
}
function normRef(v){ if(v==null) return ""; if(typeof v==="number") return String(Math.round(v)); return String(v).trim(); }
function normBar(v){ if(v==null||v==="") return ""; if(typeof v==="number") return String(Math.round(v)); return String(v).trim().replace(/[.\s]/g,""); }
function normCod(s){ return String(s==null?"":s).replace(/\D/g,"").replace(/^0+/,""); }
function ueDe(v){
  if(typeof v==="string"){ var u=v.toUpperCase(); if(u.indexOf("UND")>=0) return 1; var d=u.replace(/\D/g,""); return d?parseInt(d,10)||1:1; }
  var n=parseDbl(v); return n<1?1:Math.floor(n);
}
function rb(x){ var f=Math.floor(x), d=x-f; if(Math.abs(d-0.5)<1e-9) return f%2===0?f:f+1; return Math.round(x); } /* redondeo al par, igual que la macro */
function cajasSueltas(total,ue){ ue=ue||1; return ue>1?{c:Math.floor(total/ue),s:total%ue}:{c:0,s:total}; }
function fmtQty(total,ue){
  var x=cajasSueltas(total,ue), p=[]; if(x.c) p.push(x.c+" C"+ue); if(x.s||!x.c) p.push(x.s+" u."); return p.join(" + ");
}
function nf(n,d){ return Number(n).toLocaleString("es-CO",{maximumFractionDigits:d==null?0:d,minimumFractionDigits:d==null?0:d}); }
function pct(x){ return Math.round(x*100)+"%"; }
function hoy(){ var d=new Date(); return d.toISOString().slice(0,10); }
function ordenRef(a,b){ var x=/^\d+$/.test(a)?parseFloat(a):1e15, y=/^\d+$/.test(b)?parseFloat(b):1e15; return x===y?(a<b?-1:a>b?1:0):x-y; }
function uniq(a){ var o={},r=[]; a.forEach(function(x){ if(!o[x]){ o[x]=1; r.push(x); } }); return r; }

/* ---------- estado y almacenamiento ---------- */
var S = {
  rol: LS.raw("ops_rol")||null,
  maestro: LS.get("ops_maestro",{}),     /* ref -> {d,b,u,g,l,p,vi,ve} */
  ofertas: LS.get("ops_ofertas",{}),     /* OF -> [{r,d,c}] */
  sesiones: LS.get("ops_sesiones",[]),   /* supervisor: sesiones de alistamiento */
  mis: LS.get("ops_mis",[]),             /* operario: listas recibidas con avance */
  res: LS.get("ops_res",{}),             /* resultados importados: clave -> {ts,e} */
  cap: LS.get("ops_cap",{}),             /* placa -> {kg,m3} (manual) */
  umb: LS.get("ops_umb",{bajo:0.6,alto:1,cob:0.95}),
  desp: LS.get("ops_desp",{planillas:[],lineas:{},archivos:[]}),
  modoScan: LS.raw("ops_scanmode")||"camara",
  exigir: LS.raw("ops_exigir")!=="0"
};
function save(k){
  var m={maestro:"ops_maestro",ofertas:"ops_ofertas",sesiones:"ops_sesiones",mis:"ops_mis",res:"ops_res",cap:"ops_cap",umb:"ops_umb",desp:"ops_desp"};
  return LS.set(m[k],S[k]);
}
var nav=[];  /* pila de vistas */
function go(v,p){ nav.push({v:v,p:p||{}}); render(); window.scrollTo(0,0); }
function back(){ if(nav.length>1) nav.pop(); render(); window.scrollTo(0,0); }
function reset(v,p){ nav=[{v:v,p:p||{}}]; render(); window.scrollTo(0,0); }
function cur(){ return nav[nav.length-1]; }

/* ---------- Excel ---------- */
function leerExcel(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){ try{ res(XLSX.read(new Uint8Array(fr.result),{type:"array"})); }catch(e){ rej(e); } };
    fr.onerror=function(){ rej(new Error("No se pudo leer el archivo")); };
    fr.readAsArrayBuffer(file);
  });
}
/* busca la hoja y la fila de encabezados que contiene alguno de los nombres clave */
function tablaDe(wb,claves,pref){
  var names=wb.SheetNames.slice();
  if(pref&&names.indexOf(pref)>0){ names.splice(names.indexOf(pref),1); names.unshift(pref); }
  for(var s=0;s<names.length;s++){
    var aoa=XLSX.utils.sheet_to_json(wb.Sheets[names[s]],{header:1,raw:true,defval:""});
    for(var i=0;i<Math.min(aoa.length,25);i++){
      for(var j=0;j<aoa[i].length;j++){
        if(claves.indexOf(normH(aoa[i][j]))>=0) return {hoja:names[s],hdr:aoa[i],rows:aoa.slice(i+1)};
      }
    }
  }
  return null;
}
function colMap(hdr,alias){
  var m={}; var h=hdr.map(normH);
  Object.keys(alias).forEach(function(k){ m[k]=-1; for(var j=0;j<h.length;j++){ if(alias[k].indexOf(h[j])>=0){ m[k]=j; break; } } });
  return m;
}
var A_LIN={ref:["referencia"],desc:["desc. item","descripcion","descripcion item","desc item"],bar:["codigo barra principal","codigo barras principal","codigo de barras principal","cod ean","codigo de barras"],ue:["factor u.m. emp.","factor u.m. empaque","u.m. emp.","u.m. empaque","u.e","unidad empaque"],cant:["cantidad","cant. comprom.","cant. comprometida","salidas (inv.)","cant"],bod:["bodega"],grupo:["grupo shopper"],linea:["linea proveedor"],doc:["nro documento","documento","numero factura","factura"]};
var NOMBRE_TIPO={FAC:"Facturas",PED:"Pedidos",REQ:"Requisiciones",REM:"Remisiones",DOC:"Otros"};
/* Tipo de documento segun las columnas (y, si hace falta, el prefijo del numero):
   REM = remision (TCA, TBV...: "Salidas (inv.)") · REQ = requisicion (RQT/RQV: "Cant. comprometida") · FAC = factura (FV...) · PED = pedido */
function tipoDe(hdr,docs){
  var h=hdr.map(normH); function tiene(x){ return h.indexOf(x)>=0; }
  if(tiene("salidas (inv.)")) return "REM";
  if(tiene("cant. comprometida")&&(tiene("bodega entrada")||tiene("bodega salida"))) return "REQ";
  if(tiene("cliente resumen factura")||tiene("numero planilla de factura")) return "FAC";
  if(tiene("cant. comprom.")) return "PED";
  var p=String(docs[0]||"").toUpperCase();
  if(/^FV/.test(p)) return "FAC"; if(/-RQ[TV]-|^RQ[TV]/.test(p)) return "REQ"; if(/^T(CA|BV)/.test(p)) return "REM";
  return "DOC";
}
var A_MAE={ref:["referencia"],desc:["descripcion","desc. item"],bar:["codigo de barras","codigo barra principal"],ue:["factor u.m.","factor u.m. emp."],grupo:["grupo shopper"],linea:["linea proveedor"],peso:["001-peso individual"],vi:["001-volumen individual"],ae:["001-ancho embalaje"],he:["001-alto embalaje"],pe:["001-profundidad embalaje"]};
var A_OF={of:["codigo ofera","codigo oferta","oferta"],comp:["codigo producto","componente"],desc:["descripcion producto","descripcion componente"],cant:["cantidad oferta","cant.","cant"]};
var A_PLA={num:["numero"],fecha:["fecha"],fac:["numero factura"],veh:["vehiculo"],est:["estado"]};

/* Lineas de pedido o factura: SOLO se conservan referencia, descripcion de producto, barras, empaque, cantidad, bodega, grupo, linea y n.º de documento */
function parseLineas(t){
  var m=colMap(t.hdr,A_LIN);
  if(m.ref<0||m.cant<0) throw new Error("El archivo debe traer las columnas Referencia y Cantidad.");
  var out=[],docs={},primero="";
  t.rows.forEach(function(r){
    var ref=normRef(r[m.ref]); if(!ref) return;
    var c=parseDbl(r[m.cant]); if(!(c>0)) return;
    var doc=m.doc>=0?String(r[m.doc]||"").trim():""; if(doc){ docs[doc]=1; if(!primero) primero=doc; }
    out.push({ref:ref,desc:m.desc>=0?String(r[m.desc]||"").trim():"",bar:m.bar>=0?normBar(r[m.bar]):"",ue:m.ue>=0?ueDe(r[m.ue]):0,cant:c,bod:m.bod>=0?String(r[m.bod]||"").trim():"",grupo:m.grupo>=0?String(r[m.grupo]||"").trim():"",linea:m.linea>=0?String(r[m.linea]||"").trim():"",doc:doc});
  });
  var tipo=tipoDe(t.hdr,[primero]); out.forEach(function(l){ l.t=tipo; });
  return {lineas:out,docs:Object.keys(docs).length,cols:m,tipo:tipo};
}
function cargarMaestro(t){
  var m=colMap(t.hdr,A_MAE); if(m.ref<0) throw new Error("El maestro debe traer la columna Referencia.");
  var mae={},n=0;
  t.rows.forEach(function(r){
    var ref=normRef(r[m.ref]); if(!ref||mae[ref]) return;
    var ve=(m.ae>=0&&m.he>=0&&m.pe>=0)?parseDbl(r[m.ae])*parseDbl(r[m.he])*parseDbl(r[m.pe]):0;
    mae[ref]={d:m.desc>=0?String(r[m.desc]||"").trim():"",b:m.bar>=0?normBar(r[m.bar]):"",u:m.ue>=0?ueDe(r[m.ue]):1,g:m.grupo>=0?String(r[m.grupo]||"").trim():"",l:m.linea>=0?String(r[m.linea]||"").trim():"",p:m.peso>=0?parseDbl(r[m.peso]):0,vi:m.vi>=0?parseDbl(r[m.vi]):0,ve:ve}; n++;
  });
  return {mae:mae,n:n};
}
function cargarOfertas(t){
  var m=colMap(t.hdr,A_OF); if(m.of<0||m.comp<0||m.cant<0) throw new Error("La composición debe traer código de oferta, código de producto y cantidad.");
  var of={},n=0;
  t.rows.forEach(function(r){
    var o=normRef(r[m.of]).toUpperCase(), c=normRef(r[m.comp]); if(!o||!c) return;
    (of[o]=of[o]||[]).push({r:c,d:m.desc>=0?String(r[m.desc]||"").trim():"",c:parseDbl(r[m.cant])}); n++;
  });
  return {of:of,n:n,ofertas:Object.keys(of).length};
}

/* ---------- logica de negocio ---------- */
/* Desglose de ofertas virtuales (OF): igual que la macro. Cantidad del componente = cantidad pedida x cantidad en la oferta. */
function desglosar(lineas,noDes){   /* noDes: {REM:1,REQ:1} = tipos cuyas OF se dejan como producto armado */
  var ueArch={}; lineas.forEach(function(l){ if(!/^OF/i.test(l.ref)&&l.ue>0&&!ueArch[l.ref]) ueArch[l.ref]=l.ue; });
  var out=[],sin={},nOF=0,nComp=0;
  lineas.forEach(function(l){
    var esOF=/^OF/i.test(l.ref), omitir=!!(noDes&&noDes[l.t]), comp=(esOF&&!omitir)?S.ofertas[l.ref.toUpperCase()]:null;
    if(comp){
      nOF++;
      comp.forEach(function(c){
        var m=S.maestro[c.r]||{};
        out.push({ref:c.r,desc:c.d||m.d||"",bar:m.b||"",ue:ueArch[c.r]||m.u||1,cant:rb(l.cant*c.c),bod:l.bod,grupo:"",linea:"",doc:l.doc,t:l.t}); nComp++;
      });
    } else { if(esOF&&!omitir) sin[l.ref]=l.desc; out.push(l); }
  });
  return {lineas:out,nOF:nOF,nComp:nComp,sin:sin};
}
/* ---- tipos de documento en una sesion nueva ---- */
function resumenTipos(raw){ var o={}; raw.forEach(function(l){ var k=l.t||"DOC", x=o[k]=o[k]||{n:0,u:0,of:0}; x.n++; x.u+=l.cant; if(/^OF/i.test(l.ref)) x.of++; }); return o; }
function totalesPorRef(raw,t){ var m={}; raw.forEach(function(l){ if(l.t===t) m[l.ref]=(m[l.ref]||0)+l.cant; }); return m; }
/* Requisiciones y remisiones: la remision es el resultado de la requisicion. Si traen las mismas cantidades por referencia son lo mismo. */
function mismosProductos(raw){
  var a=totalesPorRef(raw,"REQ"), b=totalesPorRef(raw,"REM"), ka=Object.keys(a), kb=Object.keys(b); if(!ka.length||!kb.length) return false;
  var ig=0; ka.forEach(function(k){ if(b[k]===a[k]) ig++; }); return ig/Math.max(ka.length,kb.length)>=0.9;
}
/* Recalcula lo que entra a la sesion segun los tipos incluidos y el modo de las ofertas (OF) */
function armarNueva(){
  var N=NUEVA, lineas=N.raw.filter(function(l){ return !N.excl[l.t||"DOC"]; }), noDes=N.dejarOF?{REM:1,REQ:1}:null;
  var des=desglosar(lineas,noDes), bods=uniq(des.lineas.map(function(l){ return l.bod; }).filter(Boolean)).sort(), refs={},un=0,dd={};
  des.lineas.forEach(function(l){ refs[l.ref]=1; un+=l.cant; });
  lineas.forEach(function(l){ if(l.doc) dd[l.doc]=1; });
  N.lineas=des.lineas; N.des=des; N.refs=Object.keys(refs).length; N.unid=un; N.docs=Object.keys(dd).length; N.bodegas=bods;
  N.ofRem=lineas.filter(function(l){ return /^OF/i.test(l.ref)&&(l.t==="REM"||l.t==="REQ"); }).length;
  N.selBod=(N.selBod||bods).filter(function(b){ return bods.indexOf(b)>=0; }); if(!N.selBod.length) N.selBod=bods.slice();
}
/* Consolida por referencia: suma cantidades; completa grupo/linea/empaque/barras desde el maestro */
function consolidar(lineas,bodegas){
  var mp={};
  lineas.forEach(function(l){
    if(bodegas&&bodegas.length&&l.bod&&bodegas.indexOf(l.bod)<0) return;
    var m=S.maestro[l.ref]||{}, k=l.ref, it=mp[k];
    if(!it){ it=mp[k]={ref:l.ref,desc:l.desc||m.d||"",bar:l.bar||m.b||"",ue:(l.ue>0?l.ue:(m.u||1)),total:0,grupo:l.grupo||m.g||"SIN GRUPO",linea:l.linea||m.l||"SIN LÍNEA"}; }
    it.total+=l.cant; it._t=it._t||{}; if(l.t) it._t[l.t]=1;
    if(!it.desc) it.desc=l.desc||m.d||""; if(!it.bar) it.bar=l.bar||m.b||"";
  });
  return Object.keys(mp).sort(ordenRef).map(function(k){ var it=mp[k]; it.tipos=Object.keys(it._t||{}).sort().join("/"); delete it._t; return it; });
}
/* Peso y volumen: cajas x volumen de embalaje + sueltas x volumen individual (misma logica de la macro) */
function carga(items){
  var kg=0,cm3=0,sin=[],und=0,cj=0,su=0;
  items.forEach(function(it){
    var x=cajasSueltas(it.total,it.ue), m=S.maestro[it.ref];
    und+=it.total; cj+=x.c; su+=x.s;
    if(m&&m.p>0&&m.vi>0&&m.ve>0){ kg+=it.total*m.p/1000; cm3+=x.c*m.ve+x.s*m.vi; } else sin.push(it.ref);
  });
  return {kg:kg,m3:cm3/1e6,und:und,cj:cj,su:su,sin:sin};
}
function veredicto(c,cap,cob){
  var us=[]; if(cap&&cap.kg>0) us.push(c.kg/cap.kg); if(cap&&cap.m3>0) us.push(c.m3/cap.m3);
  if(!us.length) return {k:"sin",t:"Sin capacidad",cls:"info",u:null};
  if(cob!=null&&cob<S.umb.cob) return {k:"inc",t:"Datos incompletos",cls:"info",u:null};
  var u=Math.max.apply(null,us);
  if(u>S.umb.alto) return {k:"sob",t:"Sobrecargado",cls:"bad",u:u};
  if(u<S.umb.bajo) return {k:"des",t:"Desaprovechado",cls:"warn",u:u};
  return {k:"bien",t:"Bien aprovechado",cls:"ok",u:u};
}
/* Avisos: ofertas que quedaron sin desglosar (sin composicion) y referencias sin peso/dimensiones */
function avisosCarga(c){
  var of=c.sin.filter(function(r){ return /^OF/i.test(r); }), sp=c.sin.filter(function(r){ return !/^OF/i.test(r); }), h="";
  if(of.length) h+='<div class="hint warn" style="margin-top:8px"><b>'+of.length+' ofertas sin composición</b> (no se desglosaron y no suman peso): '+esc(of.slice(0,6).join(", "))+(of.length>6?"…":"")+'. Cargue la composición en Datos de apoyo y vuelva a cargar el archivo.</div>';
  if(sp.length) h+='<div class="hint warn" style="margin-top:8px"><b>'+sp.length+' referencias sin peso o dimensiones</b> en el maestro (no suman al peso): '+esc(sp.slice(0,6).join(", "))+(sp.length>6?"…":"")+'</div>';
  return h;
}
/* Reparte items entre alistadores segun grupo shopper (y linea proveedor opcional) */
function repartir(items,alist){
  var por={},sin=[]; alist.forEach(function(a){ por[a.nom]=[]; });
  items.forEach(function(it){
    var dest=null;
    for(var i=0;i<alist.length;i++){
      var a=alist[i]; if(!a.grupos||a.grupos.indexOf(it.grupo)<0) continue;
      if(a.lineas&&a.lineas.length&&a.lineas.indexOf(it.linea)<0) continue;
      dest=a.nom; break;
    }
    if(dest) por[dest].push(it); else sin.push(it);
  });
  return {por:por,sin:sin};
}

/* ---------- paquetes (compartir sin servidor) ---------- */
function b64u(b){ var s=""; for(var i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function unb64u(t){ t=t.replace(/-/g,"+").replace(/_/g,"/"); while(t.length%4) t+="="; var s=atob(t),b=new Uint8Array(s.length); for(var i=0;i<s.length;i++) b[i]=s.charCodeAt(i); return b; }
async function codificar(obj){
  var bytes=new TextEncoder().encode(JSON.stringify(obj));
  if(window.CompressionStream){
    var cs=new Blob([bytes]).stream().pipeThrough(new CompressionStream("gzip"));
    return "OPS1.g."+b64u(new Uint8Array(await new Response(cs).arrayBuffer()));
  }
  return "OPS1.p."+b64u(bytes);
}
async function decodificar(code){
  var m=/^OPS1\.([gp])\.(.+)$/.exec(String(code).replace(/\s+/g,"")); if(!m) throw new Error("Código no válido");
  var b=unb64u(m[2]);
  if(m[1]==="g"){ var ds=new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip")); b=new Uint8Array(await new Response(ds).arrayBuffer()); }
  return JSON.parse(new TextDecoder().decode(b));
}

function compartirTexto(nombreArchivo,texto,titulo){
  try{
    var f=new File([texto],nombreArchivo,{type:"text/plain"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){ navigator.share({files:[f],title:titulo}).catch(function(){}); return; }
  }catch(e){}
  var a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([texto],{type:"text/plain"})); a.download=nombreArchivo; document.body.appendChild(a); a.click(); a.remove(); toast("Archivo descargado");
}
function copiar(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(function(){ toast("Código copiado"); },function(){ toast("No se pudo copiar"); }); }
  else { var x=document.createElement("textarea"); x.value=t; document.body.appendChild(x); x.select(); try{ document.execCommand("copy"); toast("Código copiado"); }catch(e){} x.remove(); }
}

  var i=document.createElement("input"); i.type="file"; i.accept=accept; if(multiple) i.multiple=true; i.style.display="none"; document.body.appendChild(i);

}

   Tablas: ops_listas y ops_res (ver supabase_setup.sql). Solo datos de producto y cantidades; nunca clientes. */
function sb(method,path,body,extra){

    if(!r.ok) return r.text().then(function(t){ throw new Error(r.status===404||/PGRST205|does not exist/.test(t)?"Faltan las tablas en Supabase: ejecute supabase_setup.sql":("Error de la nube ("+r.status+")")); });

    case "abrirses": go("ses",{i:+d("i")}); break;
    case "tab": c.p.tab=d("t"); render(); break;
    case "borrases": if(confirm("¿Eliminar esta sesión?")){ S.sesiones.splice(c.p.i,1); save("sesiones"); back(); } break;
    case "addalist": var an=($("#an").value||"").trim(); if(!an) break; var s1=S.sesiones[c.p.i]; if(s1.alist.some(function(x){ return x.nom.toLowerCase()===an.toLowerCase(); })){ toast("Ese nombre ya existe"); break; } s1.alist.push({nom:an,grupos:[],lineas:[]}); save("sesiones"); render(); break;
    case "quitalist": S.sesiones[c.p.i].alist.splice(+d("i"),1); save("sesiones"); render(); break;
    case "toggrupo": var al=S.sesiones[c.p.i].alist[+d("i")], gx=al.grupos.indexOf(d("g")); if(gx>=0) al.grupos.splice(gx,1); else al.grupos.push(d("g")); al.lineas=[]; save("sesiones"); render(); break;
    case "toglinea": var al2=S.sesiones[c.p.i].alist[+d("i")], lx=al2.lineas.indexOf(d("l")); if(lx>=0) al2.lineas.splice(lx,1); else al2.lineas.push(d("l")); save("sesiones"); render(); break;
    case "autoreparto": var s2=S.sesiones[c.p.i], gg=conteoGrupos(s2.items), carga2={}; s2.alist.forEach(function(x){ x.grupos=[]; x.lineas=[]; carga2[x.nom]=0; });
      Object.keys(gg).sort(function(x,y){ return gg[y].n-gg[x].n; }).forEach(function(k){ var best=s2.alist.slice().sort(function(x,y){ return carga2[x.nom]-carga2[y.nom]; })[0]; best.grupos.push(k); carga2[best.nom]+=gg[k].n; });
      save("sesiones"); render(); break;
    case "shfile": case "shcode": case "shwork":
      var s3=S.sesiones[c.p.i], a3=s3.alist[+d("i")], its3=repartir(s3.items,s3.alist).por[a3.nom];
      if(!its3.length){ toast("Este operario no tiene referencias asignadas"); break; }
      var pq=paqueteDe("alist",s3.id,a3.nom,s3.nombre,its3);
      if(a==="shwork"){ reintentoLista(pq); break; }
      codificar(pq).then(function(code){ if(a==="shcode") copiar(code); else compartirTexto("lista_"+a3.nom.replace(/\W+/g,"_")+"_"+s3.id+".txt",code,"Lista de alistamiento"); }); break;
    case "impres": case "resfile": textoDeArchivo(function(p){ try{ importarResultado(p); toast("Resultado de "+p.nom+" importado"); render(); }catch(x){ toast(x.message); } }); break;
    case "respegar": pegarCodigo("Pegar resultado",function(p){ try{ importarResultado(p); toast("Resultado de "+p.nom+" importado"); render(); }catch(x){ toast(x.message); } }); break;
    /* operario */
    case "abrirlista": textoDeArchivo(reintentoLista); break;
    case "pegarlista": pegarCodigo("Pegar lista",reintentoLista); break;
    case "trab": TR={q:"",f:"pend",g:""}; go("trab",{i:+d("i")}); break;
    case "filt": TR.f=d("f"); render(); break;
    case "fgrupo": TR.g=TR.g===d("g")?"":d("g"); render(); break;
    case "linea": abrirLinea(c.p.i,+d("i"),false); break;
    case "escanear": var mm=S.mis[c.p.i]; escanear("Escanear producto",function(code){ var ix2=buscarPorCodigo(mm,code); if(ix2<0) toast("Ese producto no está en su lista"); else abrirLinea(c.p.i,ix2,true); }); break;
    case "enviarres": var m4=S.mis[c.p.i]; if(NUBE&&m4.nube){ subirRes(m4,true); break; } resultadoDe(m4).then(function(code){ compartirTexto("resultado_"+m4.nom.replace(/\W+/g,"_")+".txt",code,"Resultado"); var bg=abrirSheet('<h3>Resultado listo</h3><p class="small muted">Se compartió el archivo. También puede copiar el código y enviarlo por WhatsApp.</p><div class="row"><button class="btn gold" id="rc">Copiar código</button><button class="btn ghost" id="rx">Cerrar</button></div>'); $("#rc",bg).onclick=function(){ copiar(code); }; $("#rx",bg).onclick=cerrarSheet; }); break;
    /* despacho */
    case "cargapla": elegirExcel(function(wb){ var t=tablaDe(wb,["numero factura"],"Sheet1")||tablaDe(wb,["vehiculo"]); if(!t){ toast("No se encontró la planilla (Número factura / Vehículo)"); return; }
      var m=colMap(t.hdr,A_PLA); if(m.num<0||m.fac<0||m.veh<0){ toast("La planilla debe traer Número, Número factura y Vehículo"); return; }
      var mp={},orden=[],anul=0;
      t.rows.forEach(function(r){ var num=String(r[m.num]||"").trim(), fac=String(r[m.fac]||"").trim(); if(!num||!fac) return;
        if(m.est>=0&&normH(r[m.est])==="anulado"){ anul++; return; }
        var f=r[m.fecha]; var fecha=typeof f==="number"?new Date(Math.round((f-25569)*86400000)).toISOString().slice(0,10):String(f||"").slice(0,10);
        var placa=String(r[m.veh]||"").trim().toUpperCase().replace(/\s+/g," "); if(/^\d+$/.test(placa)||!placa) placa="SIN VEHÍCULO";
        var pl=mp[num]; if(!pl){ pl=mp[num]={num:num,fecha:fecha,placa:placa,facs:[]}; orden.push(num); } if(pl.facs.indexOf(fac)<0) pl.facs.push(fac); });
      S.desp.planillas=orden.map(function(k){ return mp[k]; }).sort(function(x,y){ return x.fecha<y.fecha?-1:x.fecha>y.fecha?1:(+x.num)-(+y.num); });
      if(save("desp")){ toast(S.desp.planillas.length+" planillas"+(anul?" ("+anul+" anuladas omitidas)":"")); render(); } }); break;
    case "cargafac": elegirExcels(function(lista){
      var tot=0,dupT=0,nArch=0,err=[];
      lista.forEach(function(it){
        var t=tablaDe(it.wb,["referencia"],"Sheet1"); if(!t){ err.push(it.f.name); return; }
        try{
          var r=parseLineas(t), m=r.cols; if(m.doc<0){ err.push(it.f.name+" (sin Nro documento)"); return; }
          var nuevas={},omit={},cnt=0;
          t.rows.forEach(function(row){ var ref=normRef(row[m.ref]), doc=String(row[m.doc]||"").trim(), cant=parseDbl(row[m.cant]); if(!ref||!doc||!(cant>0)) return;
            if(S.desp.lineas[doc]){ omit[doc]=1; return; }
            (nuevas[doc]=nuevas[doc]||[]).push([ref,m.desc>=0?String(row[m.desc]||"").trim():"",m.bar>=0?normBar(row[m.bar]):"",m.ue>=0?ueDe(row[m.ue]):0,cant]); });
          /* desglose de ofertas dentro de cada factura */
          Object.keys(nuevas).forEach(function(doc){ var ls=nuevas[doc].map(function(a){ return {ref:a[0],desc:a[1],bar:a[2],ue:a[3],cant:a[4],bod:"",grupo:"",linea:"",doc:doc}; }); var dd=desglosar(ls); S.desp.lineas[doc]=dd.lineas.map(function(l){ return [l.ref,l.desc,l.bar,l.ue,l.cant]; }); cnt++; });
          S.desp.archivos.push({n:it.f.name,f:cnt}); tot+=cnt; dupT+=Object.keys(omit).length; nArch++;
        }catch(x){ err.push(it.f.name+": "+x.message); }
      });
      if(save("desp")){ toast(tot+" facturas cargadas"+(lista.length>1?" de "+nArch+" archivos":"")+(dupT?" · "+dupT+" repetidas omitidas":"")+(err.length?" · con problemas: "+err.join(", "):"")); render(); }
    }); break;
    case "dfecha": DF.fecha=d("f"); render(); break;
    case "abrirpl": go("placa",{i:+d("i")}); break;
    case "plfile": case "plcode": case "plwork":
      var cal=planillasCalc()[+d("i")]; if(!cal.items.length){ toast("Esta planilla no tiene líneas cargadas"); break; }
      var pq2=paqueteDe("desp","D"+cal.pl.num,cal.pl.placa,"Cargue "+cal.pl.placa+" · planilla "+cal.pl.num,cal.items);
      if(a==="plwork"){ reintentoLista(pq2); break; }
      codificar(pq2).then(function(code){ if(a==="plcode") copiar(code); else compartirTexto("cargue_"+cal.pl.placa+"_"+cal.pl.num+".txt",code,"Lista de cargue"); }); break;
    case "publicar": if(!avisoPrueba()) break;
      var sp=S.sesiones[c.p.i], rp=repartir(sp.items,sp.alist||[]), proms=[], np=0;
      sp.alist.forEach(function(a){ var its=rp.por[a.nom]; if(!its.length) return; np++; proms.push(publicarLista(paqueteDe("alist",sp.id,a.nom,sp.nombre,its))); });
      if(!np){ toast("No hay listas para publicar"); break; }
      Promise.all(proms).then(function(){ toast(np+" listas publicadas en línea"); },function(err){ toast(err.message||"No se pudo publicar"); }); break;
    case "retirar": var sr=S.sesiones[c.p.i]; if(confirm("¿Retirar de la nube las listas y resultados de esta sesión?")) retirarNube(sr.id).then(function(){ toast("Retirado de la nube"); },function(err){ toast(err.message||"No se pudo retirar"); }); break;
    case "nuberes": bajarRes(S.sesiones[c.p.i].id,false); break;
    case "nubebuscar": var tv=d("t"), bgN=abrirSheet('<h3>Listas en línea</h3><p class="small muted" id="nbMsg">Buscando…</p><div id="nbLista"></div><div class="sp"></div><button class="btn ghost block" id="nbX">Cerrar</button>');
      $("#nbX",bgN).onclick=cerrarSheet;
      buscarListas(tv).then(function(rows){ var box=$("#nbLista",bgN); if(!box) return; $("#nbMsg",bgN).textContent=rows.length?"Toque la que le corresponde:":"No hay listas publicadas todavía.";
        box.innerHTML=rows.map(function(r){ return '<button class="tile" data-act="nubeabrir" data-id="'+esc(r.id)+'"><div class="ic">'+(r.tipo==="desp"?"⛟":"▦")+'</div><div><b>'+esc(r.nom)+'</b><span>'+esc(r.titulo||"")+' · '+new Date(r.actualizado).toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"})+'</span></div></button>'; }).join(""); },
        function(err){ var m2=$("#nbMsg",bgN); if(m2) m2.textContent=err.message||"Sin conexión"; }); break;
    case "nubeabrir": var idN=d("id"); cerrarSheet(); abrirDeNube(idN).catch(function(err){ toast(err.message||"No se pudo abrir"); }); break;
    case "plpub": if(!avisoPrueba()) break; var cl=planillasCalc()[+d("i")];
      if(!cl.items.length){ toast("Esta planilla no tiene líneas cargadas"); break; }
      publicarLista(paqueteDe("desp","D"+cl.pl.num,cl.pl.placa,"Cargue "+cl.pl.placa+" · planilla "+cl.pl.num,cl.items)).then(function(){ toast("Lista de cargue publicada"); },function(err){ toast(err.message||"No se pudo publicar"); }); break;
    case "plres": bajarRes("D"+planillasCalc()[+d("i")].pl.num,false); break;
    case "borrardesp": if(confirm("¿Borrar planillas, facturas y capacidades de despacho?")){ S.desp={planillas:[],lineas:{},archivos:[]}; save("desp"); render(); } break;
  }
});

/* ---------- arranque ---------- */
if(LS.raw("ops_tema")==="dark") document.documentElement.classList.add("dark");
if("serviceWorker" in navigator){ /* sin service worker en esta version */ }
reset(S.rol?"menu":"rol");
})();
</script>
